[package]
name = "lan-mouse-clipboard"
description = "bounded clipboard handoff state and native actor contract for lan-mouse"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[dependencies]
rustls = { version = "0.23.12", default-features = false, features = ["std", "ring"] }
sha2 = "0.10.8"
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7.11", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
rcgen = "0.13.1"
