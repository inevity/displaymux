---
# lan-mouse + tv-multiview daemon deployment
# Run from the Arch box: ansible-playbook -i inventory.ini playbook.yml
#
# In native_build mode, the control host packages the osswitch checkout and its
# root Cargo.lock vendor set. In github_release mode, every host downloads its
# native no-GTK GitHub Release asset and skips the Lan Mouse source build.
#
# Control-node prerequisites (not handled by this playbook):
#   ansible-galaxy collection install ansible.windows community.general
#
# Manual steps after the first stable-identity install (not automatable):
#   - macOS: grant lan-mouse Accessibility permission once in System Settings
#     > Privacy & Security > Accessibility. The playbook reuses a persistent
#     local signing identity, so routine rebuilds retain that authorization.
#   - macOS: disable lock screen password (Lock Screen > Require
#     password: Never). Remote input can't unlock macOS.

- name: Prepare deployment inputs
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    osswitch_source_path: "{{ playbook_dir }}/.."
    source_bundle: "{{ playbook_dir }}/osswitch-source.bundle"
    vendor_dir: "{{ playbook_dir }}/osswitch-vendor-{{ prepared_cargo_lock_sha256[:12] }}"
    vendor_archive: "{{ playbook_dir }}/osswitch-vendor-{{ prepared_cargo_lock_sha256[:12] }}.zip"
  tasks:
    - name: Validate Lan Mouse installation method
      ansible.builtin.assert:
        that: lan_mouse_install_method in ['native_build', 'github_release']
        fail_msg: >-
          lan_mouse_install_method must be native_build or github_release,
          not {{ lan_mouse_install_method }}

    - name: Validate configured host roles
      ansible.builtin.assert:
        that:
          - lan_mouse_server_host in ['linux', 'mac', 'windows']
          - groups['linux_desktop'] | length == 1
          - groups['mac_desktop'] | length == 1
          - groups['windows_desktop'] | length == 1
        fail_msg: >-
          lan_mouse_server_host must be linux, mac, or windows and each desktop
          inventory group must contain exactly one host.

    - name: Require a GitHub repository for release deployment
      ansible.builtin.assert:
        that: lan_mouse_github_repository | trim | length > 0
        fail_msg: >-
          Set lan_mouse_github_repository to owner/repository when using
          lan_mouse_install_method=github_release.
      when: lan_mouse_install_method == 'github_release'

    - name: Resolve one immutable GitHub release
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/scripts/resolve_github_release.py"
          - --repository
          - "{{ lan_mouse_github_repository }}"
          - --selector
          - "{{ lan_mouse_github_release_tag }}"
      environment:
        GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
      register: resolved_github_release
      changed_when: false
      when: lan_mouse_install_method == 'github_release'

    - name: Record immutable GitHub release identity
      ansible.builtin.set_fact:
        prepared_github_release: "{{ resolved_github_release.stdout | from_json }}"
      when: lan_mouse_install_method == 'github_release'

    - name: Read locked Cargo lock hash
      ansible.builtin.command:
        argv: [sha256sum, Cargo.lock]
        chdir: "{{ osswitch_source_path }}"
      register: local_cargo_lock_hash
      changed_when: false
      check_mode: false

    - name: Record current root Cargo lock identity
      ansible.builtin.set_fact:
        prepared_cargo_lock_sha256: "{{ local_cargo_lock_hash.stdout.split()[0] }}"

    - name: Remove the previous local source bundle
      ansible.builtin.file:
        path: "{{ source_bundle }}"
        state: absent
      when: lan_mouse_install_method == 'native_build'

    - name: Create the current local source bundle
      ansible.builtin.command:
        argv: [git, bundle, create, "{{ source_bundle }}", HEAD]
        chdir: "{{ osswitch_source_path }}"
      changed_when: true
      when: lan_mouse_install_method == 'native_build'

    - name: Check locked vendor archive
      ansible.builtin.stat:
        path: "{{ vendor_archive }}"
      register: vendor_archive_stat
      when: lan_mouse_install_method == 'native_build'

    - name: Generate locked versioned Cargo vendor tree
      ansible.builtin.command:
        argv:
          - cargo
          - vendor
          - --locked
          - --versioned-dirs
          - --manifest-path
          - "{{ osswitch_source_path }}/Cargo.toml"
          - "{{ vendor_dir }}"
      no_log: true
      when:
        - lan_mouse_install_method == 'native_build'
        - not vendor_archive_stat.stat.exists

    - name: Archive Cargo vendor tree for native hosts
      ansible.builtin.command:
        argv:
          - bsdtar
          - -a
          - -cf
          - "{{ vendor_archive }}"
          - -C
          - "{{ playbook_dir }}"
          - "osswitch-vendor-{{ prepared_cargo_lock_sha256[:12] }}"
        creates: "{{ vendor_archive }}"
      when: lan_mouse_install_method == 'native_build'

    - name: Verify Cargo vendor archive
      ansible.builtin.command:
        argv: [bsdtar, -tf, "{{ vendor_archive }}"]
      changed_when: false
      no_log: true
      when: lan_mouse_install_method == 'native_build'

    - name: Ensure controller-token state directory exists
      ansible.builtin.file:
        path: "{{ lan_mouse_controller_token_file | dirname }}"
        state: directory
        mode: "0700"

    - name: Generate persistent controller bearer token
      ansible.builtin.shell: |
        set -eu
        umask 077
        openssl rand -hex 32 > "{{ lan_mouse_controller_token_file }}"
      args:
        creates: "{{ lan_mouse_controller_token_file }}"
      no_log: true

- name: Build and deploy lan-mouse on all native hosts in parallel
  hosts: linux_desktop:mac_desktop:windows_desktop
  gather_facts: true
  strategy: free
  vars:
    prepared_cargo_lock_sha256: "{{ hostvars['localhost'].prepared_cargo_lock_sha256 }}"
    prepared_github_release: "{{ hostvars['localhost'].prepared_github_release | default({}) }}"
    source_bundle: "{{ playbook_dir }}/osswitch-source.bundle"
    vendor_archive: "{{ playbook_dir }}/osswitch-vendor-{{ prepared_cargo_lock_sha256[:12] }}.zip"
    lan_mouse_build_cache: "{{ ansible_facts.env.HOME | default('') }}/.cache/lan-mouse-build"
    osswitch_linux_source_dir: "{{ lan_mouse_build_cache }}/source"
    lan_mouse_linux_vendor_dir: "{{ lan_mouse_build_cache }}/osswitch-vendor-{{ prepared_cargo_lock_sha256[:12] }}"
    lan_mouse_linux_cargo_home: "{{ lan_mouse_build_cache }}/cargo-home"
    tv_multiview_config_path: "{{ ansible_facts.env.HOME | default('') }}/.config/tv-multiview/config.toml"
    mac_build_cache: "{{ ansible_facts.env.HOME | default('') }}/Library/Caches/lan-mouse-build"
    mac_source_dir: "{{ mac_build_cache }}/source"
    mac_vendor_dir: "{{ mac_build_cache }}/osswitch-vendor-{{ prepared_cargo_lock_sha256[:12] }}"
    mac_target_dir: "{{ mac_build_cache }}/target"
    mac_installed_binary: "{{ ansible_facts.env.HOME | default('') }}/.local/bin/lan-mouse"
    mac_wrapper: "{{ ansible_facts.env.HOME | default('') }}/.local/bin/run-lan-mouse"
    win_build_cache: "{{ lan_mouse_windows_build_cache }}"
    win_cargo_home: "{{ win_build_cache }}\\cargo"
    win_msys2_root: "{{ win_build_cache }}\\msys64"
    win_mingw_bin: "{{ win_msys2_root }}\\mingw64\\bin"
    win_rustup_home: "{{ win_build_cache }}\\rustup"
    win_rustup_binary: "{{ win_cargo_home }}\\bin\\rustup.exe"
    win_source_dir: "{{ win_build_cache }}\\source"
    win_vendor_dir: "{{ win_build_cache }}\\osswitch-vendor-{{ prepared_cargo_lock_sha256[:12] }}"
    win_install_dir: "{{ lan_mouse_windows_install_dir }}"
    win_msvc_dir: "{{ lan_mouse_windows_msvc_dir }}"
    win_installed_binary: "{{ win_install_dir }}\\lan-mouse.exe"
    win_wrapper: "{{ ansible_facts.env.LOCALAPPDATA | default('') }}\\lan-mouse\\run-lan-mouse.ps1"
    displaymux_host_roles:
      - linux
      - mac
      - windows
    displaymux_inventory_hosts:
      linux: "{{ groups['linux_desktop'][0] }}"
      mac: "{{ groups['mac_desktop'][0] }}"
      windows: "{{ groups['windows_desktop'][0] }}"
    displaymux_host_fingerprints:
      linux: "{{ hub_fingerprint }}"
      mac: "{{ mac_fingerprint }}"
      windows: "{{ windows_fingerprint }}"
    displaymux_default_host_positions:
      linux:
        mac: right
        windows: left
      mac:
        linux: left
        windows: right
      windows:
        linux: right
        mac: left
    displaymux_host_positions: >-
      {{ lan_mouse_host_positions | default(displaymux_default_host_positions) }}
    displaymux_opposite_positions:
      left: right
      right: left
      top: bottom
      bottom: top
  tasks:
    - name: Validate role-derived configuration inputs
      ansible.builtin.assert:
        that:
          - lan_mouse_emulation_displays['linux'] | trim | length > 0
          - lan_mouse_emulation_displays['mac'] | trim | length > 0
          - lan_mouse_emulation_displays['windows'] | trim | length > 0
          - displaymux_host_fingerprints['linux'] | trim | length > 0
          - displaymux_host_fingerprints['mac'] | trim | length > 0
          - displaymux_host_fingerprints['windows'] | trim | length > 0
          - displaymux_host_positions['linux']['mac'] in displaymux_opposite_positions
          - displaymux_host_positions['linux']['windows'] in displaymux_opposite_positions
          - displaymux_host_positions['mac']['linux'] in displaymux_opposite_positions
          - displaymux_host_positions['mac']['windows'] in displaymux_opposite_positions
          - displaymux_host_positions['windows']['linux'] in displaymux_opposite_positions
          - displaymux_host_positions['windows']['mac'] in displaymux_opposite_positions
          - displaymux_host_positions['linux']['mac'] != displaymux_host_positions['linux']['windows']
          - displaymux_host_positions['mac']['linux'] != displaymux_host_positions['mac']['windows']
          - displaymux_host_positions['windows']['linux'] != displaymux_host_positions['windows']['mac']
          - displaymux_host_positions['linux']['mac'] == displaymux_opposite_positions[displaymux_host_positions['mac']['linux']]
          - displaymux_host_positions['linux']['windows'] == displaymux_opposite_positions[displaymux_host_positions['windows']['linux']]
          - displaymux_host_positions['mac']['windows'] == displaymux_opposite_positions[displaymux_host_positions['windows']['mac']]
        fail_msg: >-
          Role-derived configuration requires displays and fingerprints for all
          hosts plus distinct, symmetric peer positions.

    - name: Run Linux native build and deployment sequence
      ansible.builtin.include_tasks: tasks/native-linux.yml
      vars:
        displaymux_host_role: linux
      when: inventory_hostname in groups['linux_desktop']

    - name: Run macOS native build and deployment sequence
      ansible.builtin.include_tasks: tasks/native-macos.yml
      vars:
        displaymux_host_role: mac
      when: inventory_hostname in groups['mac_desktop']

    - name: Run Windows native build and deployment sequence
      ansible.builtin.include_tasks: tasks/native-windows.yml
      vars:
        displaymux_host_role: windows
        tv_multiview_config_path: >-
          {{ ansible_facts.env.LOCALAPPDATA }}\tv-multiview\config.toml
      when: inventory_hostname in groups['windows_desktop']

- name: Revalidate the GitHub release after parallel deployment
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve the same immutable GitHub release again
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/scripts/resolve_github_release.py"
          - --repository
          - "{{ hostvars['localhost'].prepared_github_release.repository }}"
          - --selector
          - "{{ hostvars['localhost'].prepared_github_release.tag }}"
      environment:
        GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
      register: revalidated_github_release
      changed_when: false
      when: lan_mouse_install_method == 'github_release'

    - name: Reject a GitHub release changed during deployment
      ansible.builtin.assert:
        that: >-
          (revalidated_github_release.stdout | from_json) ==
          hostvars['localhost'].prepared_github_release
        fail_msg: >-
          The resolved release identity, manifest, asset set, or digest changed
          during deployment. Start a new deployment run.
      when: lan_mouse_install_method == 'github_release'
