---
# lan-mouse + tv-multiview daemon deployment
# Run from the Arch box: ansible-playbook -i inventory.ini playbook.yml
#
# Linux builds lan-mouse-git via a patched PKGBUILD (no GTK, pinned to
# lan_mouse_release_tag from group_vars/all.yml).
# macOS and Windows download pre-built binaries from the same tag.
#
# Control-node prerequisites (not handled by this playbook):
#   ansible-galaxy collection install ansible.windows community.general
#
# Manual steps after the first run (also not automatable):
#   - Accept the TV's pairing prompt once, on the TV itself, when the
#     daemon connects for the first time.
#   - macOS: grant lan-mouse Accessibility permission once in
#     System Settings > Privacy & Security > Accessibility.
#   - macOS: disable lock screen password (Lock Screen > Require
#     password: Never). Remote input can't unlock macOS.

- name: Deploy tv-multiview daemon and lan-mouse hub on Arch Linux
  hosts: linux_desktop
  gather_facts: true
  tasks:
    - name: Install build dependencies
      become: true
      community.general.pacman:
        name:
          - cmake
          - pkgconf
          - git
          - libx11
          - libxtst
        state: present

    - name: Ensure build directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.cache/lan-mouse-pkgbuild"
        state: directory
        mode: "0755"

    - name: Template PKGBUILD (no-GTK, pinned to release tag)
      ansible.builtin.template:
        src: templates/lan-mouse-git-PKGBUILD.j2
        dest: "{{ ansible_env.HOME }}/.cache/lan-mouse-pkgbuild/PKGBUILD"
        mode: "0644"
      register: pkgbuild_template

    - name: Check installed lan-mouse tag
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.cache/lan-mouse-tag"
      register: linux_tag_stat

    - name: Read installed tag
      ansible.builtin.slurp:
        path: "{{ ansible_env.HOME }}/.cache/lan-mouse-tag"
      register: linux_tag_content
      when: linux_tag_stat.stat.exists

    - name: Build and install lan-mouse-git (if PKGBUILD changed or tag mismatch)
      when: pkgbuild_template.changed or not linux_tag_stat.stat.exists or (linux_tag_content.content | default('') | b64decode | trim != lan_mouse_release_tag)
      block:
        - name: Build package (makepkg refuses root)
          ansible.builtin.command:
            cmd: makepkg -f --noconfirm
            chdir: "{{ ansible_env.HOME }}/.cache/lan-mouse-pkgbuild"
          changed_when: true

        - name: Install package
          become: true
          ansible.builtin.shell: |
            pacman -U --noconfirm $(ls {{ ansible_env.HOME }}/.cache/lan-mouse-pkgbuild/lan-mouse-git-*-x86_64.pkg.tar.zst 2>/dev/null || ls {{ ansible_env.HOME }}/.cache/lan-mouse-pkgbuild/*.pkg.tar.zst | grep -v debug | head -1)
          register: pkg_install
          failed_when: pkg_install.rc != 0 and 'up to date' not in pkg_install.stderr
          changed_when: pkg_install.rc == 0

        - name: Record installed tag
          ansible.builtin.copy:
            content: "{{ lan_mouse_release_tag }}"
            dest: "{{ ansible_env.HOME }}/.cache/lan-mouse-tag"
            mode: "0644"

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Build tv-multiview (Rust daemon)
      ansible.builtin.command:
        cmd: cargo build --release
        chdir: "{{ playbook_dir }}/../tv-multiview"
      register: tv_multiview_build
      changed_when: true

    - name: Install tv-multiview binary
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../tv-multiview/target/release/tv-multiview"
        dest: "{{ ansible_env.HOME }}/.local/bin/tv-multiview"
        mode: "0755"
        remote_src: false

    - name: Ensure lingering is enabled (so user services survive without an active login)
      become: true
      ansible.builtin.command: "loginctl enable-linger {{ ansible_user_id }}"
      changed_when: false

    - name: Add spoke hostnames to /etc/hosts
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
        state: present
      loop:
        - "{{ groups['mac_desktop'][0] }}"
        - "{{ groups['windows_desktop'][0] }}"

    - name: Ensure lan-mouse config dir exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/lan-mouse"
        state: directory
        mode: "0755"

    - name: Deploy lan-mouse config (hub — lists mac and windows as clients)
      ansible.builtin.template:
        src: templates/hub-config.toml.j2
        dest: "{{ ansible_env.HOME }}/.config/lan-mouse/config.toml"
        mode: "0644"
      register: hub_config_template

    - name: Ensure systemd user dir exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: Deploy lan-mouse systemd user unit
      ansible.builtin.template:
        src: templates/lan-mouse.service.j2
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/lan-mouse.service"
        mode: "0644"
      vars:
        lan_mouse_binary: "/usr/bin/lan-mouse"
      register: lm_service_template

    - name: Deploy tv-multiview systemd user unit
      ansible.builtin.template:
        src: templates/tv-multiview.service.j2
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/tv-multiview.service"
        mode: "0644"
      vars:
        tv_multiview_binary: "{{ ansible_env.HOME }}/.local/bin/tv-multiview"
      register: daemon_service_template

    - name: Reload systemd user daemon and restart services (only if something changed)
      when: >
        pkgbuild_template.changed
        or not linux_tag_stat.stat.exists
        or (linux_tag_content.content | default('') | b64decode | trim != lan_mouse_release_tag)
        or hub_config_template.changed
        or lm_service_template.changed
        or tv_multiview_build.changed
        or daemon_service_template.changed
      block:
        - name: Reload systemd user daemon
          ansible.builtin.systemd:
            scope: user
            daemon_reload: true
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"

        - name: Restart both services
          ansible.builtin.systemd:
            name: "{{ item }}"
            scope: user
            enabled: true
            state: restarted
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
          loop:
            - tv-multiview.service
            - lan-mouse.service

        - name: Verify services are running (not failed/dead)
          ansible.builtin.command: systemctl --user is-active {{ item }}
          register: service_status
          failed_when: service_status.stdout in ['failed', 'inactive', 'dead']
          loop:
            - tv-multiview.service
            - lan-mouse.service
          changed_when: false

    # Firewall is deliberately NOT touched here — open UDP {{ lan_mouse_port }}
    # and TCP {{ daemon_port }} manually, however the firewall is actually
    # set up. Guessing at nftables/firewalld/ufw here risks fighting a ruleset
    # this playbook has no visibility into.

    - name: Prompt user to accept TV pairing (first run only)
      ansible.builtin.pause:
        prompt: |
          ══════════════════════════════════════════════════════
          ACTION REQUIRED — on the LG TV:
          
          Accept the pairing prompt on the TV screen.
          (WebOS shows a 4-digit code — accept it.)
          
          Press Enter once done.
          ══════════════════════════════════════════════════════
      when: not linux_tag_stat.stat.exists

- name: Deploy lan-mouse spoke on macOS
  hosts: mac_desktop
  gather_facts: false
  pre_tasks:
    - name: Ensure wakeonlan is installed (control node)
      become: true
      community.general.pacman:
        name: wakeonlan
        state: present
      delegate_to: "{{ groups['linux_desktop'][0] }}"
      run_once: true

    - name: Wake macOS via WoL
      ansible.builtin.command: wakeonlan {{ mac_mac_address }}
      delegate_to: "{{ groups['linux_desktop'][0] }}"
      run_once: true
      changed_when: false

    - name: Let macOS network stack initialize
      ansible.builtin.wait_for:
        timeout: 15
      delegate_to: "{{ groups['linux_desktop'][0] }}"
      run_once: true

    - name: Wait for macOS SSH to be ready
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].ansible_host }}"
        port: 22
        timeout: 120

    - name: Gather facts
      ansible.builtin.setup:

  tasks:
    - name: Check installed lan-mouse tag (macOS)
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.cache/lan-mouse-tag"
      register: mac_tag_stat

    - name: Read installed tag
      ansible.builtin.slurp:
        path: "{{ ansible_env.HOME }}/.cache/lan-mouse-tag"
      register: mac_tag_content
      when: mac_tag_stat.stat.exists

    - name: Download lan-mouse for macOS (Intel)
      ansible.builtin.get_url:
        url: "https://github.com/feschber/lan-mouse/releases/download/{{ lan_mouse_release_tag }}/lan-mouse-macos-intel.zip"
        dest: "/tmp/lan-mouse-macos.zip"
        mode: "0644"
      when: not mac_tag_stat.stat.exists or (mac_tag_content.content | default('') | b64decode | trim != lan_mouse_release_tag)

    - name: Extract lan-mouse
      ansible.builtin.unarchive:
        src: "/tmp/lan-mouse-macos.zip"
        dest: "{{ ansible_env.HOME }}/Applications/"
        remote_src: true
      when: not mac_tag_stat.stat.exists or (mac_tag_content.content | default('') | b64decode | trim != lan_mouse_release_tag)

    - name: Remove quarantine attribute (macOS Gatekeeper)
      ansible.builtin.command: >
        xattr -rd com.apple.quarantine "{{ ansible_env.HOME }}/Applications/Lan Mouse.app"
      changed_when: false

    - name: Record installed tag
      ansible.builtin.copy:
        content: "{{ lan_mouse_release_tag }}"
        dest: "{{ ansible_env.HOME }}/.cache/lan-mouse-tag"
        mode: "0644"

    - name: Add Linux host to /etc/hosts
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[groups['linux_desktop'][0]].ansible_host }} {{ groups['linux_desktop'][0] }}"
        state: present

    - name: Ensure lan-mouse config dir exists  # macOS
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/lan-mouse"
        state: directory
        mode: "0755"

    - name: Deploy lan-mouse config (spoke — points back at linux hub)
      ansible.builtin.template:
        src: templates/spoke-config.toml.j2
        dest: "{{ ansible_env.HOME }}/.config/lan-mouse/config.toml"
        mode: "0644"
      vars:
        spoke_position: "{{ mac_spoke_position }}"

    - name: Deploy LaunchAgent
      ansible.builtin.template:
        src: templates/lan-mouse-daemon.plist.j2
        dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.feschber.lan-mouse.plist"
        mode: "0644"
      vars:
        lm_binary_path: "{{ ansible_env.HOME }}/Applications/Lan Mouse.app/Contents/MacOS/lan-mouse"
      register: plist_deploy

    - name: Check if LaunchAgent is already loaded
      ansible.builtin.command: launchctl list com.feschber.lan-mouse
      register: la_loaded
      failed_when: false
      changed_when: false

    - name: Load LaunchAgent (first time)
      ansible.builtin.command: >
        launchctl load -w {{ ansible_env.HOME }}/Library/LaunchAgents/com.feschber.lan-mouse.plist
      when: la_loaded.rc != 0
      changed_when: true

    - name: Restart LaunchAgent (config/binary changed)
      ansible.builtin.command: >
        launchctl unload {{ ansible_env.HOME }}/Library/LaunchAgents/com.feschber.lan-mouse.plist 2>/dev/null;
        launchctl load -w {{ ansible_env.HOME }}/Library/LaunchAgents/com.feschber.lan-mouse.plist
      when: la_loaded.rc == 0
      changed_when: true

    - name: Allow lan-mouse through macOS Application Firewall
      become: true
      ansible.builtin.command: >
        /usr/libexec/ApplicationFirewall/socketfilterfw
        --add "{{ ansible_env.HOME }}/Applications/Lan Mouse.app/Contents/MacOS/lan-mouse"
      register: fw_add
      failed_when: fw_add.rc != 0 and 'already' not in fw_add.stderr
      changed_when: fw_add.rc == 0

    - name: Unblock lan-mouse in macOS Firewall
      become: true
      ansible.builtin.command: >
        /usr/libexec/ApplicationFirewall/socketfilterfw
        --unblockapp "{{ ansible_env.HOME }}/Applications/Lan Mouse.app/Contents/MacOS/lan-mouse"
      changed_when: false

    - name: Prompt user to enable Accessibility + disable lock screen (first deploy only)
      ansible.builtin.pause:
        prompt: |
          ══════════════════════════════════════════════════════
          ACTION REQUIRED — on the Mac:
          
          System Settings → Privacy & Security → Accessibility
          → toggle Lan Mouse ON
          
          System Settings → Lock Screen
          → Require password after display off: Never
            (remote input can't unlock macOS lock screen)
          
          Press Enter once done.
          ══════════════════════════════════════════════════════
      when: not mac_tag_stat.stat.exists

- name: Deploy lan-mouse spoke on Windows
  hosts: windows_desktop
  gather_facts: false
  pre_tasks:
    - name: Wake Windows via WoL
      ansible.builtin.command: wakeonlan {{ windows_mac_address }}
      delegate_to: "{{ groups['linux_desktop'][0] }}"
      run_once: true
      changed_when: false

    - name: Let Windows network stack initialize
      ansible.builtin.wait_for:
        timeout: 15
      delegate_to: "{{ groups['linux_desktop'][0] }}"
      run_once: true

    - name: Wait for Windows SSH to be ready
      ansible.windows.win_wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 120

    - name: Gather facts
      ansible.builtin.setup:
      tags: always

  tasks:
    - name: Enable Wake-on-LAN on active network adapters
      ansible.windows.win_shell: |
        Get-NetAdapter | Where-Object {$_.Status -eq 'Up'} | ForEach-Object {
          $adapter = $_
          try {
            Set-NetAdapterAdvancedProperty -Name $adapter.Name -RegistryKeyword '*WakeOnMagicPacket' -RegistryValue 1 -ErrorAction Stop
            Write-Host "WoL enabled: $($adapter.Name)"
          } catch { }
        }
      changed_when: true

    - name: Check if sh.exe is available (needed for enter_hook)
      ansible.windows.win_shell: |
        $sh = Get-Command sh -ErrorAction SilentlyContinue
        if ($sh) { exit 0 }
        $paths = @(
          "C:\Program Files\Git\bin\sh.exe",
          "C:\Program Files (x86)\Git\bin\sh.exe",
          "$env:LOCALAPPDATA\Programs\Git\bin\sh.exe"
        )
        foreach ($p in $paths) {
          if (Test-Path $p) {
            [Environment]::SetEnvironmentVariable("PATH", "$env:PATH;$((Split-Path $p))", [EnvironmentVariableTarget]::User)
            exit 0
          }
        }
        exit 1
      register: sh_check
      failed_when: false
      changed_when: false

    - name: Install Git for Windows (provides sh.exe)
      ansible.windows.win_shell: >
        winget install --id Git.Git -e --silent --accept-package-agreements --accept-source-agreements
      when: sh_check.rc != 0
      register: winget_result
      failed_when: winget_result.rc not in [0, -1978335189]
      changed_when: "'Successfully installed' in winget_result.stdout"

    - name: Check installed lan-mouse tag (Windows)
      ansible.windows.win_stat:
        path: "{{ ansible_env.LOCALAPPDATA }}\\lan-mouse-tag"
      register: win_tag_stat

    - name: Read installed Windows tag
      ansible.windows.slurp:
        path: "{{ ansible_env.LOCALAPPDATA }}\\lan-mouse-tag"
      register: win_tag_slurp
      when: win_tag_stat.stat.exists

    - name: Download lan-mouse for Windows
      ansible.windows.win_get_url:
        url: "https://github.com/feschber/lan-mouse/releases/download/{{ lan_mouse_release_tag }}/lan-mouse-windows-x86_64.zip"
        dest: "{{ ansible_env.TEMP }}\\lan-mouse-windows.zip"
      when: not win_tag_stat.stat.exists or (win_tag_slurp.content | default('') | b64decode | trim != lan_mouse_release_tag)

    - name: Ensure install directory exists
      ansible.windows.win_file:
        path: "{{ ansible_env.LOCALAPPDATA }}\\Programs\\lan-mouse"
        state: directory

    - name: Extract lan-mouse
      ansible.windows.win_shell: >
        Expand-Archive -Path '{{ ansible_env.TEMP }}\lan-mouse-windows.zip'
        -DestinationPath '{{ ansible_env.LOCALAPPDATA }}\Programs\lan-mouse' -Force
      when: not win_tag_stat.stat.exists or (win_tag_slurp.content | default('') | b64decode | trim != lan_mouse_release_tag)

    - name: Record installed Windows tag
      ansible.windows.win_copy:
        content: "{{ lan_mouse_release_tag }}"
        dest: "{{ ansible_env.LOCALAPPDATA }}\\lan-mouse-tag"
      when: not win_tag_stat.stat.exists or (win_tag_slurp.content | default('') | b64decode | trim != lan_mouse_release_tag)

    - name: Locate lan-mouse.exe inside extracted files
      ansible.windows.win_find:
        paths: "{{ ansible_env.LOCALAPPDATA }}\\Programs\\lan-mouse"
        patterns: "lan-mouse.exe"
        recurse: true
      register: lm_exe_search

    - name: Ensure lan-mouse config dir exists (%LOCALAPPDATA%\lan-mouse)
      ansible.windows.win_file:
        path: "{{ ansible_env.LOCALAPPDATA }}\\lan-mouse"
        state: directory

    - name: Add Linux host to Windows hosts file
      ansible.windows.win_shell: |
        $hosts = "C:\Windows\System32\drivers\etc\hosts"
        $line = "{{ hostvars[groups['linux_desktop'][0]].ansible_host }} {{ groups['linux_desktop'][0] }}"
        $content = Get-Content $hosts -ErrorAction SilentlyContinue
        if ($content -notcontains $line) { Add-Content $hosts $line }

    - name: Deploy lan-mouse config (spoke — points back at linux hub)
      ansible.windows.win_template:
        src: templates/spoke-config.toml.j2
        dest: "{{ ansible_env.LOCALAPPDATA }}\\lan-mouse\\config.toml"
      vars:
        spoke_position: "{{ win_spoke_position }}"

    - name: Create scheduled task to run lan-mouse daemon at logon
      community.windows.win_scheduled_task:
        name: LanMouseDaemon
        description: "Runs lan-mouse in daemon mode at user logon"
        actions:
          - path: "{{ lm_exe_search.files[0].path }}"
            arguments: "daemon"
        triggers:
          - type: logon
        username: "{{ ansible_user }}"
        state: present
        enabled: true
        run_level: limited

    - name: Restart lan-mouse (to pick up new config)
      ansible.windows.win_shell: |
        schtasks /end /tn LanMouseDaemon 2>$null
        Start-Sleep 2
        schtasks /run /tn LanMouseDaemon
      changed_when: true

    - name: Open Windows Firewall for lan-mouse (UDP {{ lan_mouse_port }})
      ansible.windows.win_shell: |
        Remove-NetFirewallRule -Name lan-mouse -ErrorAction SilentlyContinue
        New-NetFirewallRule -Name lan-mouse -DisplayName lan-mouse -Enabled True -Profile Any -Direction Inbound -Protocol UDP -Action Allow -LocalPort {{ lan_mouse_port }}
