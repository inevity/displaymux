---
# lan-mouse + tv-multiview daemon deployment
# Run from the Arch box: ansible-playbook -i inventory.ini playbook.yml
#
# The control host packages the local checkout and one Cargo.lock vendor set.
# Linux, macOS, and Windows replace their build source, then test, build, and
# install it natively without GTK or live crates.io access.
#
# Control-node prerequisites (not handled by this playbook):
#   ansible-galaxy collection install ansible.windows community.general
#
# Manual steps after the first stable-identity install (not automatable):
#   - macOS: grant lan-mouse Accessibility permission once in System Settings
#     > Privacy & Security > Accessibility. The playbook reuses a persistent
#     local signing identity, so routine rebuilds retain that authorization.
#   - macOS: disable lock screen password (Lock Screen > Require
#     password: Never). Remote input can't unlock macOS.

- name: Prepare lan-mouse source and dependency artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    source_bundle: "/tmp/lan-mouse-source.bundle"
    vendor_dir: "/tmp/lan-mouse-vendor-{{ lan_mouse_cargo_lock_sha256[:12] }}"
    vendor_archive: "/tmp/lan-mouse-vendor-{{ lan_mouse_cargo_lock_sha256[:12] }}.zip"
  tasks:
    - name: Read locked Cargo lock hash
      ansible.builtin.command:
        argv: [sha256sum, Cargo.lock]
        chdir: "{{ lan_mouse_source_path }}"
      register: local_cargo_lock_hash
      changed_when: false

    - name: Validate locked Cargo lock identity
      ansible.builtin.assert:
        that: local_cargo_lock_hash.stdout.split()[0] == lan_mouse_cargo_lock_sha256
        fail_msg: "Cargo.lock does not match {{ lan_mouse_cargo_lock_sha256 }}"

    - name: Remove the previous local source bundle
      ansible.builtin.file:
        path: "{{ source_bundle }}"
        state: absent

    - name: Create the current local source bundle
      ansible.builtin.command:
        argv: [git, bundle, create, "{{ source_bundle }}", HEAD]
        chdir: "{{ lan_mouse_source_path }}"
      changed_when: true

    - name: Check locked vendor archive
      ansible.builtin.stat:
        path: "{{ vendor_archive }}"
      register: vendor_archive_stat

    - name: Generate locked versioned Cargo vendor tree
      ansible.builtin.command:
        argv:
          - cargo
          - vendor
          - --locked
          - --versioned-dirs
          - --manifest-path
          - "{{ lan_mouse_source_path }}/Cargo.toml"
          - "{{ vendor_dir }}"
      no_log: true
      when: not vendor_archive_stat.stat.exists

    - name: Archive Cargo vendor tree for native hosts
      ansible.builtin.command:
        argv:
          - bsdtar
          - -a
          - -cf
          - "{{ vendor_archive }}"
          - -C
          - /tmp
          - "lan-mouse-vendor-{{ lan_mouse_cargo_lock_sha256[:12] }}"
        creates: "{{ vendor_archive }}"

    - name: Verify Cargo vendor archive
      ansible.builtin.command:
        argv: [bsdtar, -tf, "{{ vendor_archive }}"]
      changed_when: false
      no_log: true

    - name: Ensure controller-token state directory exists
      ansible.builtin.file:
        path: "{{ lan_mouse_controller_token_file | dirname }}"
        state: directory
        mode: "0700"

    - name: Generate persistent controller bearer token
      ansible.builtin.shell: |
        set -eu
        umask 077
        openssl rand -hex 32 > "{{ lan_mouse_controller_token_file }}"
      args:
        creates: "{{ lan_mouse_controller_token_file }}"
      no_log: true

- name: Build and deploy lan-mouse on all native hosts in parallel
  hosts: linux_desktop:mac_desktop:windows_desktop
  gather_facts: true
  strategy: free
  vars:
    source_bundle: "/tmp/lan-mouse-source.bundle"
    vendor_archive: "/tmp/lan-mouse-vendor-{{ lan_mouse_cargo_lock_sha256[:12] }}.zip"
    lan_mouse_build_cache: "{{ ansible_facts.env.HOME | default('') }}/.cache/lan-mouse-build"
    lan_mouse_linux_source_dir: "{{ lan_mouse_build_cache }}/source"
    lan_mouse_linux_vendor_dir: "{{ lan_mouse_build_cache }}/lan-mouse-vendor-{{ lan_mouse_cargo_lock_sha256[:12] }}"
    lan_mouse_linux_cargo_home: "{{ lan_mouse_build_cache }}/cargo-home"
    tv_multiview_config_path: "{{ ansible_facts.env.HOME | default('') }}/.config/tv-multiview/config.toml"
    mac_build_cache: "{{ ansible_facts.env.HOME | default('') }}/Library/Caches/lan-mouse-build"
    mac_source_dir: "{{ mac_build_cache }}/source"
    mac_vendor_dir: "{{ mac_build_cache }}/lan-mouse-vendor-{{ lan_mouse_cargo_lock_sha256[:12] }}"
    mac_target_dir: "{{ mac_build_cache }}/target"
    mac_installed_binary: "{{ ansible_facts.env.HOME | default('') }}/.local/bin/lan-mouse"
    mac_wrapper: "{{ ansible_facts.env.HOME | default('') }}/.local/bin/run-lan-mouse"
    win_build_cache: "{{ ansible_facts.env.LOCALAPPDATA | default('') }}\\lan-mouse-build"
    win_source_dir: "{{ win_build_cache }}\\source"
    win_vendor_dir: "{{ win_build_cache }}\\lan-mouse-vendor-{{ lan_mouse_cargo_lock_sha256[:12] }}"
    win_target_dir: "{{ win_build_cache }}\\target"
    win_install_dir: "{{ ansible_facts.env.LOCALAPPDATA | default('') }}\\Programs\\lan-mouse"
    win_installed_binary: "{{ win_install_dir }}\\lan-mouse.exe"
    win_wrapper: "{{ ansible_facts.env.LOCALAPPDATA | default('') }}\\lan-mouse\\run-lan-mouse.ps1"
  tasks:
    - name: Run Linux native build and deployment sequence
      ansible.builtin.include_tasks: tasks/native-linux.yml
      when: inventory_hostname in groups['linux_desktop']

    - name: Run macOS native build and deployment sequence
      ansible.builtin.include_tasks: tasks/native-macos.yml
      when: inventory_hostname in groups['mac_desktop']

    - name: Run Windows native build and deployment sequence
      ansible.builtin.include_tasks: tasks/native-windows.yml
      when: inventory_hostname in groups['windows_desktop']
