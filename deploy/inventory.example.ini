[control]
localhost ansible_connection=local

[linux_desktop]
linux-host ansible_host=LINUX_ADDRESS ansible_user=LINUX_USER

[mac_desktop]
mac-host ansible_host=MACOS_ADDRESS ansible_user=MACOS_USER ansible_connection=ssh

[windows_desktop]
windows-host ansible_host=WINDOWS_ADDRESS ansible_user=WINDOWS_USER ansible_connection=ssh ansible_shell_type=powershell
