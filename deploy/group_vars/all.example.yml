---
# Copy this file to all.yml and replace every REPLACE_* placeholder locally.

# Lan Mouse source and release selection.
lan_mouse_repo_url: "https://github.com/inevity/displaymux.git"
lan_mouse_install_method: native_build  # native_build|github_release
lan_mouse_github_repository: "inevity/displaymux"
lan_mouse_github_release_tag: latest  # latest or an immutable release tag
lan_mouse_rust_toolchain: "1.95.0"
lan_mouse_macos_build_profile: debug  # debug|release
lan_mouse_macos_codesign_identity: "Lan Mouse Local Code Signing"
lan_mouse_macos_codesign_identifier: "org.example.lan-mouse"
lan_mouse_windows_root: "D:\\lanmouse"
lan_mouse_windows_install_dir: "{{ lan_mouse_windows_root }}"
lan_mouse_windows_build_cache: "{{ lan_mouse_windows_root }}\\build"
lan_mouse_windows_msvc_dir: "{{ lan_mouse_windows_build_cache }}\\msvc"
lan_mouse_linux_features: "layer_shell_capture,libei_capture,x11_capture,wlroots_emulation,libei_emulation,x11_emulation,rdp_emulation"
lan_mouse_log_filter: "lan_mouse=info,lan_mouse::clipboard=debug,lan_mouse::clipboard_transport=debug,lan_mouse_clipboard=debug"
displaymux_host_assignments:
  controller: linux-host
  left: windows-host
  right: mac-host
lan_mouse_emulation_displays:
  linux-host: "REPLACE_LINUX_DISPLAY_NAME"
  mac-host: "REPLACE_MACOS_DISPLAY_NAME"
  windows-host: "REPLACE_WINDOWS_DISPLAY_NAME"
lan_mouse_fingerprints:
  linux-host: "REPLACE_LINUX_TLS_FINGERPRINT"
  mac-host: "REPLACE_MACOS_TLS_FINGERPRINT"
  windows-host: "REPLACE_WINDOWS_TLS_FINGERPRINT"
lan_mouse_port: 4243
lan_mouse_clipboard_enabled: true
lan_mouse_clipboard_max_bytes: 3145728
lan_mouse_controller_http_timeout_ms: 3000
lan_mouse_controller_request_timeout_ms: 75000
lan_mouse_controller_poll_interval_ms: 250
lan_mouse_edge_double_tap_ms: 3000
lan_mouse_controller_lease_ttl_ms: 90000
lan_mouse_controller_renew_interval_ms: 5000
lan_mouse_log_max_bytes: 10485760
lan_mouse_log_backups: 5
lan_mouse_controller_token_file: "{{ lookup('env', 'HOME') }}/.local/state/lan-mouse-deploy/controller-token"
lan_mouse_fingerprint_files:
  windows-host: >-
    {{ lookup('env', 'HOME') }}/.local/state/lan-mouse-deploy/windows-host-fingerprint

# Display-controller configuration.
tv_ip: "REPLACE_TV_ADDRESS"
daemon_port: 8765
tv_multiview_log_level: info  # debug|info|warn|error|trace
tv_multiview_client_key_paths:
  linux-host: "/home/REPLACE_LINUX_USER/.config/lg-buddy/.aiopylgtv.sqlite"
  mac-host: "/Users/REPLACE_MACOS_USER/.config/lg-buddy/.aiopylgtv.sqlite"
  windows-host: "C:/Users/REPLACE_WINDOWS_USER/AppData/Local/lg-buddy/.aiopylgtv.sqlite"
tv_multiview_command_timeout_ms: 10000
tv_multiview_observation_timeout_ms: 5000
tv_multiview_grant_timeout_ms: 5000
tv_multiview_wake_timeout_ms: 60000
tv_multiview_signal_poll_ms: 10000
tv_multiview_reconnect_alert_after: 10
tv_multiview_deploy_ready_retries: 75
tv_multiview_deploy_ready_delay_seconds: 2
tv_inputs:
  linux-host: REPLACE_LINUX_TV_INPUT
  mac-host: REPLACE_MACOS_TV_INPUT
  windows-host: REPLACE_WINDOWS_TV_INPUT

# Wake-on-LAN addresses.
wake_on_lan:
  mac-host: "REPLACE_MACOS_MAC_ADDRESS"
  windows-host: "REPLACE_WINDOWS_MAC_ADDRESS"
