- name: Ensure macOS native build and runtime directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mac_build_cache }}"
    - "{{ ansible_facts.env.HOME }}/.local/bin"
    - "{{ ansible_facts.env.HOME }}/.config/lan-mouse"
    - "{{ ansible_facts.env.HOME }}/Library/LaunchAgents"
    - "{{ ansible_facts.env.HOME }}/Library/Logs"

- name: Bootstrap selected macOS Rust toolchain once
  ansible.builtin.command:
    argv: [/usr/local/bin/rustup, toolchain, install, "{{ lan_mouse_rust_toolchain }}", --profile, minimal]
  args:
    creates: >-
      {{ ansible_facts.env.HOME }}/.rustup/toolchains/{{ lan_mouse_rust_toolchain }}-{{
      'aarch64' if ansible_facts.architecture == 'arm64' else ansible_facts.architecture
      }}-apple-darwin/bin/rustc
  when: lan_mouse_install_method == 'native_build'

- name: Check persistent macOS code-signing identity
  ansible.builtin.command:
    argv:
      - security
      - find-identity
      - -v
      - -p
      - codesigning
      - /Library/Keychains/System.keychain
  register: mac_codesign_identities
  changed_when: false

- name: Bootstrap persistent macOS code-signing identity once
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    identity_dir="$(mktemp -d "${TMPDIR:-/tmp}/lan-mouse-codesign.XXXXXX")"
    trap 'rm -rf "$identity_dir"' EXIT
    identity_password="$(openssl rand -hex 32)"

    cat > "$identity_dir/openssl.cnf" <<'EOF'
    [req]
    distinguished_name = subject
    x509_extensions = extensions
    prompt = no

    [subject]
    CN = {{ lan_mouse_macos_codesign_identity }}
    O = Lan Mouse Local

    [extensions]
    basicConstraints = critical,CA:TRUE
    keyUsage = critical,digitalSignature,keyCertSign
    extendedKeyUsage = codeSigning
    subjectKeyIdentifier = hash
    authorityKeyIdentifier = keyid:always
    EOF

    openssl req -new -x509 -newkey rsa:3072 -sha256 -days 3650 -nodes \
      -config "$identity_dir/openssl.cnf" \
      -keyout "$identity_dir/identity.key" \
      -out "$identity_dir/identity.crt"
    openssl pkcs12 -export -legacy \
      -inkey "$identity_dir/identity.key" \
      -in "$identity_dir/identity.crt" \
      -name "{{ lan_mouse_macos_codesign_identity }}" \
      -passout "pass:$identity_password" \
      -out "$identity_dir/identity.p12"
    security import "$identity_dir/identity.p12" \
      -k /Library/Keychains/System.keychain \
      -P "$identity_password" \
      -T /usr/bin/codesign
    security add-trusted-cert -d -r trustRoot -p codeSign \
      -k /Library/Keychains/System.keychain \
      "$identity_dir/identity.crt"
  args:
    executable: /bin/bash
  when: >-
    ('"' ~ lan_mouse_macos_codesign_identity ~ '"') not in mac_codesign_identities.stdout
  become: true
  no_log: true

- name: Require persistent macOS code-signing identity
  ansible.builtin.command:
    argv:
      - security
      - find-identity
      - -v
      - -p
      - codesigning
      - /Library/Keychains/System.keychain
  register: mac_codesign_identity_check
  changed_when: false
  failed_when: >-
    ('"' ~ lan_mouse_macos_codesign_identity ~ '"') not in mac_codesign_identity_check.stdout

- name: Select macOS Cargo build profile
  ansible.builtin.set_fact:
    mac_cargo_profile: "{{ 'dev' if lan_mouse_macos_build_profile == 'debug' else 'lan-mouse-release' }}"
    mac_target_profile_dir: "{{ 'debug' if lan_mouse_macos_build_profile == 'debug' else 'lan-mouse-release' }}"
  when: lan_mouse_install_method == 'native_build'

- name: Resolve selected macOS Cargo path
  ansible.builtin.command:
    argv: [/usr/local/bin/rustup, which, --toolchain, "{{ lan_mouse_rust_toolchain }}", cargo]
  register: mac_cargo
  changed_when: false
  when: lan_mouse_install_method == 'native_build'

- name: Copy source bundle to macOS
  ansible.builtin.copy:
    src: "{{ source_bundle }}"
    dest: "{{ mac_build_cache }}/source.bundle"
    mode: "0644"
  when: lan_mouse_install_method == 'native_build'

- name: Copy locked vendor archive to macOS
  ansible.builtin.copy:
    src: "{{ vendor_archive }}"
    dest: "{{ mac_build_cache }}/vendor.zip"
    mode: "0644"
  when: lan_mouse_install_method == 'native_build'

- name: Extract locked Cargo vendor tree on macOS
  ansible.builtin.unarchive:
    src: "{{ mac_build_cache }}/vendor.zip"
    dest: "{{ mac_build_cache }}"
    remote_src: true
    creates: "{{ mac_vendor_dir }}"
  when: lan_mouse_install_method == 'native_build'

- name: Remove previous osswitch source on macOS
  ansible.builtin.file:
    path: "{{ mac_source_dir }}"
    state: absent
  when: lan_mouse_install_method == 'native_build'

- name: Deploy osswitch source on macOS
  ansible.builtin.command:
    argv:
      - git
      - clone
      - "{{ mac_build_cache }}/source.bundle"
      - "{{ mac_source_dir }}"
  when: lan_mouse_install_method == 'native_build'

- name: Ensure checkout-local Cargo config directory exists on macOS
  ansible.builtin.file:
    path: "{{ mac_source_dir }}/.cargo"
    state: directory
    mode: "0755"
  when: lan_mouse_install_method == 'native_build'

- name: Configure locked offline Cargo source on macOS
  ansible.builtin.template:
    src: templates/cargo-vendor-config.toml.j2
    dest: "{{ mac_source_dir }}/.cargo/config.toml"
    mode: "0644"
  vars:
    cargo_vendor_path: "{{ mac_vendor_dir }}"
  when: lan_mouse_install_method == 'native_build'

- name: Test and build lan-mouse natively on macOS
  environment:
    CARGO_TARGET_DIR: "{{ mac_target_dir }}"
    CARGO_INCREMENTAL: "0"
    PATH: "{{ mac_cargo.stdout | trim | dirname }}:{{ ansible_facts.env.PATH }}"
  block:
    - name: Run no-GTK macOS workspace tests
      ansible.builtin.command:
        argv:
          - "{{ mac_cargo.stdout | trim }}"
          - test
          - --frozen
          - -p
          - lan-mouse
          - -p
          - input-capture
          - -p
          - input-emulation
          - -p
          - input-event
          - -p
          - lan-mouse-cli
          - -p
          - lan-mouse-clipboard
          - -p
          - lan-mouse-ipc
          - -p
          - lan-mouse-proto
          - --no-default-features
        chdir: "{{ mac_source_dir }}"
      changed_when: false
      async: 3600
      poll: 5

    - name: Build no-GTK macOS binary
      ansible.builtin.command:
        argv:
          - "{{ mac_cargo.stdout | trim }}"
          - build
          - --frozen
          - --profile
          - "{{ mac_cargo_profile }}"
          - -p
          - lan-mouse
          - --bin
          - lan-mouse
          - --no-default-features
        chdir: "{{ mac_source_dir }}"
      changed_when: true
      async: 3600
      poll: 5
  when: lan_mouse_install_method == 'native_build'

- name: Select native macOS release candidate
  ansible.builtin.set_fact:
    mac_release_candidate: "{{ mac_target_dir }}/{{ mac_target_profile_dir }}/lan-mouse"
  when: lan_mouse_install_method == 'native_build'

- name: Download no-GTK macOS GitHub Release asset
  when: lan_mouse_install_method == 'github_release'
  vars:
    mac_release_arch: >-
      {{ {'arm64': 'aarch64', 'aarch64': 'aarch64', 'x86_64': 'x86_64'}.get(
         ansible_facts.architecture, '') }}
    mac_release_asset: "lan-mouse-no-gtk-macos-{{ mac_release_arch }}"
    mac_release_archive: "{{ mac_release_asset }}.zip"
  block:
    - name: Require a supported macOS release architecture
      ansible.builtin.assert:
        that: mac_release_arch | length > 0
        fail_msg: >-
          No no-GTK macOS release asset is defined for
          {{ ansible_facts.architecture }}.

    - name: Download no-GTK macOS release archive
      ansible.builtin.get_url:
        url: "{{ prepared_github_release.asset_urls[mac_release_archive] }}"
        dest: "{{ mac_build_cache }}/{{ mac_release_archive }}"
        mode: "0644"
        checksum: "sha256:{{ prepared_github_release.asset_digests[mac_release_archive] }}"
        force: true

    - name: Remove previous extracted macOS release
      ansible.builtin.file:
        path: "{{ mac_build_cache }}/{{ mac_release_asset }}"
        state: absent

    - name: Extract no-GTK macOS release archive
      ansible.builtin.unarchive:
        src: "{{ mac_build_cache }}/{{ mac_release_archive }}"
        dest: "{{ mac_build_cache }}"
        remote_src: true

    - name: Select downloaded macOS release candidate
      ansible.builtin.set_fact:
        mac_release_candidate: >-
          {{ mac_build_cache }}/{{ mac_release_asset }}/lan-mouse

- name: Sign macOS daemon with persistent identity
  ansible.builtin.command:
    argv:
      - codesign
      - --force
      - --sign
      - "{{ lan_mouse_macos_codesign_identity }}"
      - --identifier
      - "{{ lan_mouse_macos_codesign_identifier }}"
      - "{{ mac_release_candidate }}"
  changed_when: true

- name: Inspect persistent macOS designated requirement
  ansible.builtin.command:
    argv:
      - codesign
      - -d
      - --requirements
      - '-'
      - "{{ mac_release_candidate }}"
  register: mac_designated_requirement
  changed_when: false
  failed_when: >-
    mac_designated_requirement.rc != 0
    or 'cdhash' in ((mac_designated_requirement.stdout | default(''))
                    ~ (mac_designated_requirement.stderr | default('')))
    or lan_mouse_macos_codesign_identifier
       not in ((mac_designated_requirement.stdout | default(''))
               ~ (mac_designated_requirement.stderr | default('')))

- name: Install stable macOS daemon binary
  ansible.builtin.copy:
    src: "{{ mac_release_candidate }}"
    dest: "{{ mac_installed_binary }}"
    remote_src: true
    mode: "0755"

- name: Record installed GitHub release identity on macOS
  when: lan_mouse_install_method == 'github_release'
  block:
    - name: Ensure macOS release state directory exists
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/Library/Application Support/osswitch"
        state: directory
        mode: "0700"

    - name: Write macOS release identity marker
      ansible.builtin.copy:
        content: "{{ prepared_github_release | to_nice_json }}\n"
        dest: "{{ ansible_facts.env.HOME }}/Library/Application Support/osswitch/release.json"
        mode: "0600"

- name: Add Linux host to /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[groups['linux_desktop'][0]].ansible_host }} {{ groups['linux_desktop'][0] }}"
    state: present

- name: Deploy lan-mouse macOS spoke configuration
  ansible.builtin.template:
    src: templates/spoke-config.toml.j2
    dest: "{{ ansible_facts.env.HOME }}/.config/lan-mouse/config.toml"
    mode: "0600"
  vars:
    spoke_position: "{{ mac_spoke_position }}"
    spoke_host: mac
  no_log: true

- name: Deploy bounded macOS log wrapper
  ansible.builtin.template:
    src: templates/lan-mouse-macos-wrapper.sh.j2
    dest: "{{ mac_wrapper }}"
    mode: "0755"
  vars:
    lan_mouse_macos_binary: "{{ mac_installed_binary }}"

- name: Deploy LaunchAgent
  ansible.builtin.template:
    src: templates/lan-mouse-daemon.plist.j2
    dest: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.feschber.lan-mouse.plist"
    mode: "0644"
  vars:
    lm_launcher_path: "{{ mac_wrapper }}"

- name: Check if LaunchAgent is already loaded
  ansible.builtin.command: launchctl list com.feschber.lan-mouse
  register: la_loaded
  failed_when: false
  changed_when: false

- name: Unload changed LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, unload, "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.feschber.lan-mouse.plist"]
  when: la_loaded.rc == 0
  failed_when: false
  changed_when: true

- name: Load current LaunchAgent
  ansible.builtin.command:
    argv: [launchctl, load, -w, "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/com.feschber.lan-mouse.plist"]
  changed_when: true

- name: Allow lan-mouse through macOS Application Firewall
  become: true
  ansible.builtin.command:
    argv: [/usr/libexec/ApplicationFirewall/socketfilterfw, --add, "{{ mac_installed_binary }}"]
  register: fw_add
  failed_when: fw_add.rc != 0 and 'already' not in fw_add.stderr
  changed_when: fw_add.rc == 0

- name: Unblock lan-mouse in macOS Firewall
  become: true
  ansible.builtin.command:
    argv: [/usr/libexec/ApplicationFirewall/socketfilterfw, --unblockapp, "{{ mac_installed_binary }}"]
  changed_when: false

- name: Verify macOS LaunchAgent is loaded
  ansible.builtin.command:
    argv: [launchctl, list, com.feschber.lan-mouse]
  changed_when: false

- name: Verify persistent macOS log files exist
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/Library/Logs/{{ item }}"
  loop:
    - lan-mouse.log
    - lan-mouse.err.log
  register: mac_logs

- name: Require persistent macOS log sources
  ansible.builtin.assert:
    that: mac_logs.results | selectattr('stat.exists', 'equalto', true) | list | length == 2
