- name: Ensure Windows native build and runtime directories exist
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ win_build_cache }}"
    - "{{ win_install_dir }}"
    - "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse"
    - "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse\\logs"

- name: Bootstrap selected Windows Rust toolchain once
  ansible.windows.win_shell: |
    rustup toolchain install {{ lan_mouse_rust_toolchain }} --profile minimal
    exit $LASTEXITCODE
  args:
    creates: >-
      {{ ansible_facts.env.USERPROFILE }}\.rustup\toolchains\{{ lan_mouse_rust_toolchain
      }}-x86_64-pc-windows-msvc\bin\rustc.exe
  when: lan_mouse_install_method == 'native_build'

- name: Locate Windows MSVC x64 Build Tools
  ansible.windows.win_shell: |
    $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
    if (-not (Test-Path $vswhere)) { throw "vswhere.exe is missing" }
    $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
    if (-not $installation) { throw "MSVC x64 Build Tools are missing" }
    Write-Output $installation
  register: win_vs_installation
  changed_when: false
  when: lan_mouse_install_method == 'native_build'

- name: Locate PowerShell 7 for bounded log wrapper
  ansible.windows.win_shell: |
    $path = (Get-Command pwsh -ErrorAction Stop).Source
    Write-Output $path
  register: win_pwsh
  changed_when: false

- name: Copy source bundle to Windows
  ansible.windows.win_copy:
    src: "{{ source_bundle }}"
    dest: "{{ win_build_cache }}\\source.bundle"
  when: lan_mouse_install_method == 'native_build'

- name: Copy locked vendor archive to Windows
  ansible.windows.win_copy:
    src: "{{ vendor_archive }}"
    dest: "{{ win_build_cache }}\\vendor.zip"
  when: lan_mouse_install_method == 'native_build'

- name: Extract locked Cargo vendor tree on Windows
  ansible.windows.win_shell: |
    Expand-Archive -Path "{{ win_build_cache }}\vendor.zip" -DestinationPath "{{ win_build_cache }}" -Force
  args:
    creates: "{{ win_vendor_dir }}"
  when: lan_mouse_install_method == 'native_build'

- name: Remove previous lan-mouse source on Windows
  ansible.windows.win_file:
    path: "{{ win_source_dir }}"
    state: absent
  when: lan_mouse_install_method == 'native_build'

- name: Deploy lan-mouse source on Windows
  ansible.windows.win_shell: |
    git clone "{{ win_build_cache }}\source.bundle" "{{ win_source_dir }}"
    exit $LASTEXITCODE
  when: lan_mouse_install_method == 'native_build'

- name: Record source repository origin on Windows
  ansible.windows.win_shell: |
    git -C "{{ win_source_dir }}" remote set-url origin "{{ lan_mouse_repo_url }}"
    exit $LASTEXITCODE
  changed_when: false
  when: lan_mouse_install_method == 'native_build'

- name: Ensure checkout-local Cargo config directory exists on Windows
  ansible.windows.win_file:
    path: "{{ win_source_dir }}\\.cargo"
    state: directory
  when: lan_mouse_install_method == 'native_build'

- name: Configure locked offline Cargo source on Windows
  ansible.windows.win_template:
    src: templates/cargo-vendor-config.toml.j2
    dest: "{{ win_source_dir }}\\.cargo\\config.toml"
  vars:
    cargo_vendor_path: "{{ win_vendor_dir }}"
  when: lan_mouse_install_method == 'native_build'

- name: Verify Windows offline dependency resolution
  ansible.windows.win_shell: |
    $env:RUSTUP_TOOLCHAIN = "{{ lan_mouse_rust_toolchain }}"
    cargo metadata --frozen --format-version 1 | Out-Null
    exit $LASTEXITCODE
  args:
    chdir: "{{ win_source_dir }}"
  changed_when: false
  when: lan_mouse_install_method == 'native_build'

- name: Build and test lan-mouse natively on Windows
  block:
    - name: Run no-GTK Windows workspace tests
      ansible.windows.win_shell: |
        $env:RUSTUP_TOOLCHAIN = "{{ lan_mouse_rust_toolchain }}"
        $env:CARGO_TARGET_DIR = "{{ win_target_dir }}"
        $env:CARGO_INCREMENTAL = "0"
        $command = "call `"{{ win_vs_installation.stdout | trim }}\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && cargo test --frozen --target-dir `"{{ win_target_dir }}`" --workspace --exclude lan-mouse-gtk --no-default-features"
        cmd.exe /d /c $command
        exit $LASTEXITCODE
      args:
        chdir: "{{ win_source_dir }}"
      changed_when: false
      async: 3600
      poll: 5

    - name: Build no-GTK Windows release binary
      ansible.windows.win_shell: |
        $env:RUSTUP_TOOLCHAIN = "{{ lan_mouse_rust_toolchain }}"
        $env:CARGO_TARGET_DIR = "{{ win_target_dir }}"
        $env:CARGO_INCREMENTAL = "0"
        $command = "call `"{{ win_vs_installation.stdout | trim }}\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && cargo build --frozen --target-dir `"{{ win_target_dir }}`" --release --bin lan-mouse --no-default-features"
        cmd.exe /d /c $command
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (-not (Test-Path "{{ win_target_dir }}\release\lan-mouse.exe")) {
          throw "cargo succeeded without producing {{ win_target_dir }}\release\lan-mouse.exe"
        }
        exit $LASTEXITCODE
      args:
        chdir: "{{ win_source_dir }}"
      changed_when: true
      async: 3600
      poll: 5
  when: lan_mouse_install_method == 'native_build'

- name: Select native Windows release candidate
  ansible.builtin.set_fact:
    win_release_candidate: "{{ win_target_dir }}\\release\\lan-mouse.exe"
  when: lan_mouse_install_method == 'native_build'

- name: Download no-GTK Windows GitHub Release asset
  when: lan_mouse_install_method == 'github_release'
  vars:
    win_release_asset: lan-mouse-no-gtk-windows-x86_64
    win_release_archive: "{{ win_release_asset }}.zip"
    win_release_extract_dir: "{{ win_build_cache }}\\release-artifact"
    github_release_path: >-
      {{ 'latest/download' if lan_mouse_github_release_tag == 'latest'
         else 'download/' ~ lan_mouse_github_release_tag }}
  block:
    - name: Download no-GTK Windows release archive
      ansible.windows.win_get_url:
        url: >-
          https://github.com/{{ lan_mouse_github_repository }}/releases/{{
          github_release_path }}/{{ win_release_archive }}
        dest: "{{ win_build_cache }}\\{{ win_release_archive }}"
        force: true

    - name: Remove previous extracted Windows release
      ansible.windows.win_file:
        path: "{{ win_release_extract_dir }}"
        state: absent

    - name: Extract no-GTK Windows release archive
      ansible.windows.win_shell: |
        Expand-Archive -Path "{{ win_build_cache }}\{{ win_release_archive }}" -DestinationPath "{{ win_release_extract_dir }}" -Force

    - name: Select downloaded Windows release candidate
      ansible.builtin.set_fact:
        win_release_candidate: "{{ win_release_extract_dir }}\\lan-mouse.exe"

- name: Require Windows release candidate before stopping the daemon
  ansible.windows.win_stat:
    path: "{{ win_release_candidate }}"
  register: win_release_artifact

- name: Validate Windows release candidate
  ansible.builtin.assert:
    that:
      - win_release_artifact.stat.exists
      - win_release_artifact.stat.size | int > 0

- name: Check Windows interactive desktop before binary replacement
  ansible.windows.win_shell: |
    $targetUser = "{{ ansible_user }}"
    $active = Get-CimInstance Win32_Process -Filter "Name = 'explorer.exe'" |
      ForEach-Object {
        $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($owner.User -ieq $targetUser) { $true }
      }
    if ($active -contains $true) { Write-Output "active" }
  register: win_interactive_before_replace
  changed_when: false

- name: Check existing Windows lan-mouse process before binary replacement
  ansible.windows.win_shell: |
    $expected = [System.IO.Path]::GetFullPath("{{ win_installed_binary }}")
    $process = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
      Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
    if ($process) { Write-Output "running" }
  register: win_process_before_replace
  changed_when: false

- name: Require a replacement desktop before stopping a running Windows daemon
  ansible.builtin.assert:
    that:
      - "'running' not in win_process_before_replace.stdout or 'active' in win_interactive_before_replace.stdout"
    fail_msg: >-
      Refusing to stop the running Windows lan-mouse daemon because the deployment user
      has no interactive desktop in which the replacement process can start.

- name: Stop existing lan-mouse scheduled task before binary replacement
  ansible.windows.win_shell: |
    schtasks /end /tn LanMouseDaemon 2>$null | Out-Null
    $expected = [System.IO.Path]::GetFullPath("{{ win_installed_binary }}")
    $processes = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
      Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
    $processes | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop }

    $deadline = (Get-Date).AddSeconds(10)
    do {
      $remaining = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
        Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
      if (-not $remaining) { break }
      Start-Sleep -Milliseconds 100
    } while ((Get-Date) -lt $deadline)
    if ($remaining) { throw "lan-mouse.exe did not stop before replacement" }
  changed_when: false

- name: Install only the Windows daemon executable
  ansible.windows.win_copy:
    src: "{{ win_release_candidate }}"
    dest: "{{ win_installed_binary }}"
    remote_src: true

- name: Add Linux host to Windows hosts file
  ansible.windows.win_shell: |
    $hosts = "C:\Windows\System32\drivers\etc\hosts"
    $line = "{{ hostvars[groups['linux_desktop'][0]].ansible_host }} {{ groups['linux_desktop'][0] }}"
    $content = Get-Content $hosts -ErrorAction SilentlyContinue
    if ($content -notcontains $line) {
      Add-Content $hosts $line
      Write-Output "created"
    }
  register: win_hosts_entry
  changed_when: "'created' in win_hosts_entry.stdout"

- name: Deploy lan-mouse Windows spoke configuration
  ansible.windows.win_template:
    src: templates/spoke-config.toml.j2
    dest: "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse\\config.toml"
  vars:
    spoke_position: "{{ win_spoke_position }}"
    spoke_host: windows
  no_log: true

- name: Deploy bounded Windows log wrapper
  ansible.windows.win_template:
    src: templates/lan-mouse-windows-wrapper.ps1.j2
    dest: "{{ win_wrapper }}"
  vars:
    lan_mouse_windows_binary: "{{ win_installed_binary }}"

- name: Create scheduled task for bounded-log lan-mouse daemon
  community.windows.win_scheduled_task:
    name: LanMouseDaemon
    description: "Supervises lan-mouse at user logon and re-enables input emulation after unlock"
    actions:
      - path: "{{ win_pwsh.stdout | trim }}"
        arguments: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{{ win_wrapper }}"'
    triggers:
      - type: logon
        user_id: "{{ ansible_facts.netbios_name }}\\{{ ansible_user }}"
      - type: session_state_change
        state_change: session_unlock
        user_id: "{{ ansible_facts.netbios_name }}\\{{ ansible_user }}"
    username: "{{ ansible_user }}"
    logon_type: interactive_token
    state: present
    enabled: true
    run_level: limited
    allow_demand_start: true
    allow_hard_terminate: true
    disallow_start_if_on_batteries: false
    stop_if_going_on_batteries: false
    start_when_available: true
    execution_time_limit: PT0S
    multiple_instances: 0

- name: Detect Windows interactive desktop for the deployment user
  ansible.windows.win_shell: |
    $targetUser = "{{ ansible_user }}"
    $active = Get-CimInstance Win32_Process -Filter "Name = 'explorer.exe'" |
      ForEach-Object {
        $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($owner.User -ieq $targetUser) { $true }
      }
    if ($active -contains $true) { Write-Output "active" }
  register: win_interactive_desktop
  changed_when: false

- name: Record Windows interactive desktop availability
  ansible.builtin.set_fact:
    win_interactive_desktop_available: "{{ 'active' in win_interactive_desktop.stdout }}"

- name: Decide whether Windows daemon restart is required
  ansible.builtin.set_fact:
    win_runtime_changed: true

- name: Restart Windows lan-mouse when runtime inputs changed
  ansible.windows.win_shell: |
    schtasks /end /tn LanMouseDaemon 2>$null | Out-Null
    $expected = [System.IO.Path]::GetFullPath("{{ win_installed_binary }}")
    $processes = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
      Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
    $processes | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop }

    $deadline = (Get-Date).AddSeconds(10)
    do {
      $remaining = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
        Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
      if (-not $remaining) { break }
      Start-Sleep -Milliseconds 100
    } while ((Get-Date) -lt $deadline)
    if ($remaining) { throw "lan-mouse.exe did not stop before scheduled task restart" }

    schtasks /run /tn LanMouseDaemon
    exit $LASTEXITCODE
  when:
    - win_runtime_changed
    - win_interactive_desktop_available
  changed_when: true

- name: Ensure Windows lan-mouse is running when inputs are unchanged
  ansible.windows.win_shell: |
    $expected = [System.IO.Path]::GetFullPath("{{ win_installed_binary }}")
    $expectedWrapper = [System.IO.Path]::GetFullPath("{{ win_wrapper }}")
    $process = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
      Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
    $parent = if ($process) {
      Get-CimInstance Win32_Process -Filter "ProcessId = $($process.ParentProcessId)"
    }
    $task = Get-ScheduledTask -TaskName LanMouseDaemon
    $supervised = $process -and
      $parent.Name -eq "pwsh.exe" -and
      $parent.CommandLine -like "*$expectedWrapper*" -and
      $task.State -eq "Running"

    if (-not $supervised) {
      schtasks /end /tn LanMouseDaemon 2>$null | Out-Null
      if ($process) {
        Stop-Process -Id $process.ProcessId -Force -ErrorAction Stop
      }

      $deadline = (Get-Date).AddSeconds(10)
      do {
        $remaining = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
          Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
        if (-not $remaining) { break }
        Start-Sleep -Milliseconds 100
      } while ((Get-Date) -lt $deadline)
      if ($remaining) { throw "unsupervised lan-mouse.exe did not stop" }

      schtasks /run /tn LanMouseDaemon
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      Write-Output "started"
    }
  register: win_ensure_running
  when:
    - not win_runtime_changed
    - win_interactive_desktop_available
  changed_when: "'started' in win_ensure_running.stdout"

- name: Wait for Windows lan-mouse process
  ansible.windows.win_shell: |
    $expected = [System.IO.Path]::GetFullPath("{{ win_installed_binary }}")
    $expectedWrapper = [System.IO.Path]::GetFullPath("{{ win_wrapper }}")
    $process = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
      Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
    if (-not $process) { throw "lan-mouse.exe is not running" }
    $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($process.ParentProcessId)"
    if (-not $parent -or $parent.Name -ne "pwsh.exe" -or $parent.CommandLine -notlike "*$expectedWrapper*") {
      throw "lan-mouse.exe is not supervised by the scheduled wrapper"
    }
    if ((Get-ScheduledTask -TaskName LanMouseDaemon).State -ne "Running") {
      throw "LanMouseDaemon scheduled task is not running"
    }
    Write-Output $process.ExecutablePath
  register: win_process
  retries: 10
  delay: 1
  until: win_process.rc == 0
  when: win_interactive_desktop_available
  changed_when: false

- name: Verify persistent Windows log files exist
  ansible.windows.win_stat:
    path: "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse\\logs\\{{ item }}"
  loop:
    - lan-mouse.log
    - lan-mouse.err.log
  register: win_logs

- name: Require persistent Windows log sources
  ansible.builtin.assert:
    that: win_logs.results | selectattr('stat.exists', 'equalto', true) | list | length == 2

- name: Open Windows Firewall for lan-mouse (UDP {{ lan_mouse_port }})
  ansible.windows.win_shell: |
    $existing = Get-NetFirewallRule -Name lan-mouse -ErrorAction SilentlyContinue
    if (-not $existing) {
      New-NetFirewallRule -Name lan-mouse -DisplayName lan-mouse -Enabled True -Profile Any -Direction Inbound -Protocol UDP -Action Allow -LocalPort {{ lan_mouse_port }} | Out-Null
      Write-Output "created"
    }
  register: win_firewall
  changed_when: "'created' in win_firewall.stdout"

- name: Open Windows Firewall for authenticated clipboard (TCP {{ lan_mouse_port }})
  ansible.windows.win_shell: |
    $existing = Get-NetFirewallRule -Name lan-mouse-clipboard -ErrorAction SilentlyContinue
    if (-not $existing) {
      New-NetFirewallRule -Name lan-mouse-clipboard -DisplayName "lan-mouse authenticated clipboard" -Enabled True -Profile Any -Direction Inbound -Protocol TCP -Action Allow -LocalPort {{ lan_mouse_port }} | Out-Null
      Write-Output "created"
    }
  register: win_clipboard_firewall
  changed_when: "'created' in win_clipboard_firewall.stdout"
