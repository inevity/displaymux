- name: Require configured Windows storage drives
  ansible.windows.win_shell: |
    $root = [System.IO.Path]::GetPathRoot("{{ win_install_dir }}")
    if (-not $root -or -not (Test-Path -LiteralPath $root -PathType Container)) {
      throw "Windows install drive is unavailable: $root"
    }
    $root = [System.IO.Path]::GetPathRoot("{{ win_build_cache }}")
    if (-not $root -or -not (Test-Path -LiteralPath $root -PathType Container)) {
      throw "Windows build drive is unavailable: $root"
    }
  changed_when: false

- name: Ensure Windows native build and runtime directories exist
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ win_build_cache }}"
    - "{{ win_install_dir }}"
    - "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse"
    - "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse\\logs"

- name: Select native Rust ABI for the Windows build
  ansible.builtin.set_fact:
    # Visual Studio 2022 supports Windows 10 1909 (build 18363) and newer.
    # Older LTSC builds use Rust's GNU ABI and do not depend on Visual Studio.
    win_use_msvc: >-
      {{ (ansible_facts.distribution_version.split('.')[2] | int) >= 18363 }}
    win_native_rust_toolchain: >-
      {{ lan_mouse_rust_toolchain
         if (ansible_facts.distribution_version.split('.')[2] | int) >= 18363
         else lan_mouse_rust_toolchain ~ '-x86_64-pc-windows-gnu' }}
    win_target_dir: >-
      {{ win_build_cache }}\target-{{ 'msvc'
         if (ansible_facts.distribution_version.split('.')[2] | int) >= 18363
         else 'gnu' }}

- name: Check Windows rustup bootstrap
  ansible.windows.win_stat:
    path: "{{ win_rustup_binary }}"
  register: win_rustup
  when: lan_mouse_install_method == 'native_build'

- name: Bootstrap rustup under the configured Windows build root once
  when:
    - lan_mouse_install_method == 'native_build'
    - not win_rustup.stat.exists
  block:
    - name: Download rustup-init for Windows
      ansible.windows.win_get_url:
        url: https://win.rustup.rs/x86_64
        dest: "{{ win_build_cache }}\\rustup-init.exe"

    - name: Install rustup without modifying the interactive user PATH
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $env:CARGO_HOME = "{{ win_cargo_home }}"
        $env:RUSTUP_HOME = "{{ win_rustup_home }}"
        & "{{ win_build_cache }}\rustup-init.exe" -y --no-modify-path --profile minimal --default-toolchain none
        if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with code $LASTEXITCODE" }

- name: Bootstrap selected Windows Rust toolchain once
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $env:CARGO_HOME = "{{ win_cargo_home }}"
    $env:RUSTUP_HOME = "{{ win_rustup_home }}"
    & "{{ win_rustup_binary }}" toolchain install {{ win_native_rust_toolchain }} --profile minimal
    if ($LASTEXITCODE -ne 0) { throw "rustup exited with code $LASTEXITCODE" }
  args:
    creates: >-
      {{ win_rustup_home }}\toolchains\{{ win_native_rust_toolchain
      }}{{ '-x86_64-pc-windows-msvc' if (win_use_msvc | bool) else '' }}\bin\rustc.exe
  when: lan_mouse_install_method == 'native_build'

- name: Check MinGW toolchain on legacy Windows
  ansible.windows.win_stat:
    path: "{{ win_mingw_bin }}\\gcc.exe"
  register: win_mingw_gcc
  when:
    - lan_mouse_install_method == 'native_build'
    - not (win_use_msvc | bool)

- name: Bootstrap MSYS2 MinGW toolchain once on legacy Windows
  when:
    - lan_mouse_install_method == 'native_build'
    - not (win_use_msvc | bool)
    - not win_mingw_gcc.stat.exists
  block:
    - name: Download MSYS2 self-extracting base archive
      ansible.windows.win_get_url:
        url: https://repo.msys2.org/distrib/msys2-x86_64-latest.sfx.exe
        dest: "{{ win_build_cache }}\\msys2-x86_64-latest.sfx.exe"

    - name: Extract MSYS2 under the configured Windows build root
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        & "{{ win_build_cache }}\msys2-x86_64-latest.sfx.exe" -y "-o{{ win_build_cache }}"
        if ($LASTEXITCODE -ne 0) { throw "MSYS2 extraction exited with code $LASTEXITCODE" }
      args:
        creates: "{{ win_msys2_root }}\\usr\\bin\\bash.exe"

    - name: Install MinGW GCC and binutils
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        & "{{ win_msys2_root }}\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc"
        if ($LASTEXITCODE -ne 0) { throw "MSYS2 package installation exited with code $LASTEXITCODE" }

- name: Verify MinGW compiler and import-library tools
  ansible.windows.win_stat:
    path: "{{ win_mingw_bin }}\\{{ item }}"
  loop:
    - gcc.exe
    - dlltool.exe
    - as.exe
  register: win_mingw_tools
  when:
    - lan_mouse_install_method == 'native_build'
    - not (win_use_msvc | bool)

- name: Require MinGW compiler and import-library tools
  ansible.builtin.assert:
    that:
      - win_mingw_tools.results | map(attribute='stat.exists') | min
      - win_mingw_tools.results | map(attribute='stat.size') | map('int') | min > 0
    fail_msg: >-
      The legacy Windows GNU build requires gcc.exe, dlltool.exe, and as.exe
      under {{ win_mingw_bin }}.
  when:
    - lan_mouse_install_method == 'native_build'
    - not (win_use_msvc | bool)

- name: Probe Windows MSVC x64 Build Tools
  ansible.windows.win_shell: |
    $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
    if (Test-Path $vswhere) {
      & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
    }
  register: win_vs_installation_probe
  changed_when: false
  when:
    - lan_mouse_install_method == 'native_build'
    - win_use_msvc | bool

- name: Bootstrap Windows MSVC x64 Build Tools once
  when:
    - lan_mouse_install_method == 'native_build'
    - win_use_msvc | bool
    - win_vs_installation_probe.stdout | trim | length == 0
  block:
    - name: Download Visual Studio Build Tools bootstrapper
      ansible.windows.win_get_url:
        url: https://aka.ms/vs/17/release/vs_BuildTools.exe
        dest: "{{ win_build_cache }}\\vs_BuildTools.exe"

    - name: Install Visual C++ x64 build workload
      ansible.windows.win_shell: |
        $arguments = @(
          '--quiet',
          '--wait',
          '--norestart',
          '--nocache',
          '--installPath', '{{ win_msvc_dir }}',
          '--add', 'Microsoft.VisualStudio.Workload.VCTools',
          '--includeRecommended'
        )
        $process = Start-Process -FilePath "{{ win_build_cache }}\vs_BuildTools.exe" -ArgumentList $arguments -Wait -PassThru
        if ($process.ExitCode -notin @(0, 3010)) {
          throw "Visual Studio Build Tools installer exited with code $($process.ExitCode)"
        }
      async: 3600
      poll: 5

- name: Locate Windows MSVC x64 Build Tools
  ansible.windows.win_shell: |
    $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
    if (-not (Test-Path $vswhere)) { throw "vswhere.exe is missing" }
    $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
    if (-not $installation) { throw "MSVC x64 Build Tools are missing" }
    Write-Output $installation
  register: win_vs_installation
  changed_when: false
  when:
    - lan_mouse_install_method == 'native_build'
    - win_use_msvc | bool

- name: Locate PowerShell 7 for bounded log wrapper
  ansible.windows.win_shell: |
    $path = (Get-Command pwsh -ErrorAction Stop).Source
    Write-Output $path
  register: win_pwsh
  changed_when: false

- name: Copy source bundle to Windows
  ansible.windows.win_copy:
    src: "{{ source_bundle }}"
    dest: "{{ win_build_cache }}\\source.bundle"
  when: lan_mouse_install_method == 'native_build'

- name: Copy locked vendor archive to Windows
  ansible.windows.win_copy:
    src: "{{ vendor_archive }}"
    dest: "{{ win_build_cache }}\\vendor.zip"
  when: lan_mouse_install_method == 'native_build'

- name: Extract locked Cargo vendor tree on Windows
  ansible.windows.win_shell: |
    Expand-Archive -Path "{{ win_build_cache }}\vendor.zip" -DestinationPath "{{ win_build_cache }}" -Force
  args:
    creates: "{{ win_vendor_dir }}"
  when: lan_mouse_install_method == 'native_build'

- name: Remove previous osswitch source on Windows
  ansible.windows.win_file:
    path: "{{ win_source_dir }}"
    state: absent
  when: lan_mouse_install_method == 'native_build'

- name: Deploy osswitch source on Windows
  ansible.windows.win_shell: |
    git clone "{{ win_build_cache }}\source.bundle" "{{ win_source_dir }}"
    exit $LASTEXITCODE
  when: lan_mouse_install_method == 'native_build'

- name: Ensure checkout-local Cargo config directory exists on Windows
  ansible.windows.win_file:
    path: "{{ win_source_dir }}\\.cargo"
    state: directory
  when: lan_mouse_install_method == 'native_build'

- name: Configure locked offline Cargo source on Windows
  ansible.windows.win_template:
    src: templates/cargo-vendor-config.toml.j2
    dest: "{{ win_source_dir }}\\.cargo\\config.toml"
  vars:
    cargo_vendor_path: "{{ win_vendor_dir }}"
  when: lan_mouse_install_method == 'native_build'

- name: Verify Windows offline dependency resolution
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $env:CARGO_HOME = "{{ win_cargo_home }}"
    $env:RUSTUP_HOME = "{{ win_rustup_home }}"
    {% if not (win_use_msvc | bool) %}
    $env:PATH = "{{ win_mingw_bin }};$env:PATH"
    {% endif %}
    & "{{ win_rustup_binary }}" run {{ win_native_rust_toolchain }} cargo metadata --frozen --format-version 1 | Out-Null
    if ($LASTEXITCODE -ne 0) { throw "cargo metadata exited with code $LASTEXITCODE" }
  args:
    chdir: "{{ win_source_dir }}"
  changed_when: false
  when: lan_mouse_install_method == 'native_build'

- name: Build and test lan-mouse natively on Windows
  block:
    - name: Run no-GTK Windows workspace tests
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $env:CARGO_HOME = "{{ win_cargo_home }}"
        $env:RUSTUP_HOME = "{{ win_rustup_home }}"
        {% if not (win_use_msvc | bool) %}
        $env:PATH = "{{ win_mingw_bin }};$env:PATH"
        {% endif %}
        $env:CARGO_TARGET_DIR = "{{ win_target_dir }}"
        $env:CARGO_INCREMENTAL = "0"
        {% if win_use_msvc | bool %}
        $command = "call `"{{ win_vs_installation.stdout | trim }}\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && `"{{ win_rustup_binary }}`" run {{ win_native_rust_toolchain }} cargo test --frozen --target-dir `"{{ win_target_dir }}`" -p lan-mouse -p input-capture -p input-emulation -p input-event -p lan-mouse-cli -p lan-mouse-clipboard -p lan-mouse-ipc -p lan-mouse-proto --no-default-features"
        cmd.exe /d /c $command
        {% else %}
        & "{{ win_rustup_binary }}" run {{ win_native_rust_toolchain }} cargo test --frozen --target-dir "{{ win_target_dir }}" -p lan-mouse -p input-capture -p input-emulation -p input-event -p lan-mouse-cli -p lan-mouse-clipboard -p lan-mouse-ipc -p lan-mouse-proto --no-default-features
        {% endif %}
        if ($LASTEXITCODE -ne 0) { throw "cargo test exited with code $LASTEXITCODE" }
      args:
        chdir: "{{ win_source_dir }}"
      changed_when: false
      async: 3600
      poll: 5

    - name: Build no-GTK Windows release binary
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $env:CARGO_HOME = "{{ win_cargo_home }}"
        $env:RUSTUP_HOME = "{{ win_rustup_home }}"
        {% if not (win_use_msvc | bool) %}
        $env:PATH = "{{ win_mingw_bin }};$env:PATH"
        {% endif %}
        $env:CARGO_TARGET_DIR = "{{ win_target_dir }}"
        $env:CARGO_INCREMENTAL = "0"
        {% if win_use_msvc | bool %}
        $command = "call `"{{ win_vs_installation.stdout | trim }}\Common7\Tools\VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && `"{{ win_rustup_binary }}`" run {{ win_native_rust_toolchain }} cargo build --frozen --target-dir `"{{ win_target_dir }}`" --profile lan-mouse-release -p lan-mouse --bin lan-mouse --no-default-features"
        cmd.exe /d /c $command
        {% else %}
        & "{{ win_rustup_binary }}" run {{ win_native_rust_toolchain }} cargo build --frozen --target-dir "{{ win_target_dir }}" --profile lan-mouse-release -p lan-mouse --bin lan-mouse --no-default-features
        {% endif %}
        if ($LASTEXITCODE -ne 0) { throw "cargo build exited with code $LASTEXITCODE" }
        if (-not (Test-Path "{{ win_target_dir }}\lan-mouse-release\lan-mouse.exe")) {
          throw "cargo succeeded without producing {{ win_target_dir }}\lan-mouse-release\lan-mouse.exe"
        }
        exit $LASTEXITCODE
      args:
        chdir: "{{ win_source_dir }}"
      changed_when: true
      async: 3600
      poll: 5
  when: lan_mouse_install_method == 'native_build'

- name: Select native Windows release candidate
  ansible.builtin.set_fact:
    win_release_candidate: "{{ win_target_dir }}\\lan-mouse-release\\lan-mouse.exe"
  when: lan_mouse_install_method == 'native_build'

- name: Download no-GTK Windows GitHub Release asset
  when: lan_mouse_install_method == 'github_release'
  vars:
    win_release_asset: lan-mouse-no-gtk-windows-x86_64
    win_release_archive: "{{ win_release_asset }}.zip"
    win_release_extract_dir: "{{ win_build_cache }}\\release-artifact"
  block:
    - name: Download no-GTK Windows release archive
      ansible.windows.win_get_url:
        url: "{{ prepared_github_release.asset_urls[win_release_archive] }}"
        dest: "{{ win_build_cache }}\\{{ win_release_archive }}"
        checksum: "{{ prepared_github_release.asset_digests[win_release_archive] }}"
        checksum_algorithm: sha256
        force: true

    - name: Remove previous extracted Windows release
      ansible.windows.win_file:
        path: "{{ win_release_extract_dir }}"
        state: absent

    - name: Extract no-GTK Windows release archive
      ansible.windows.win_shell: |
        Expand-Archive -Path "{{ win_build_cache }}\{{ win_release_archive }}" -DestinationPath "{{ win_release_extract_dir }}" -Force

    - name: Select downloaded Windows release candidate
      ansible.builtin.set_fact:
        win_release_candidate: "{{ win_release_extract_dir }}\\lan-mouse.exe"

- name: Require Windows release candidate before stopping the daemon
  ansible.windows.win_stat:
    path: "{{ win_release_candidate }}"
  register: win_release_artifact

- name: Validate Windows release candidate
  ansible.builtin.assert:
    that:
      - win_release_artifact.stat.exists
      - win_release_artifact.stat.size | int > 0

- name: Check Windows interactive desktop before binary replacement
  ansible.windows.win_shell: |
    $targetUser = "{{ ansible_user }}"
    $active = Get-CimInstance Win32_Process -Filter "Name = 'explorer.exe'" |
      ForEach-Object {
        $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($owner.User -ieq $targetUser) { $true }
      }
    if ($active -contains $true) { Write-Output "active" }
  register: win_interactive_before_replace
  changed_when: false

- name: Check existing Windows lan-mouse process before binary replacement
  ansible.windows.win_shell: |
    $processes = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'"
    if ($processes) { Write-Output "running" }
  register: win_process_before_replace
  changed_when: false

- name: Require a replacement desktop before stopping a running Windows daemon
  ansible.builtin.assert:
    that:
      - "'running' not in win_process_before_replace.stdout or 'active' in win_interactive_before_replace.stdout"
    fail_msg: >-
      Refusing to stop the running Windows lan-mouse daemon because the deployment user
      has no interactive desktop in which the replacement process can start.

- name: Stop existing lan-mouse scheduled task before binary replacement
  ansible.windows.win_shell: |
    schtasks /end /tn LanMouseDaemon 2>$null | Out-Null
    $processes = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'"
    $processes | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop }

    $deadline = (Get-Date).AddSeconds(10)
    do {
      $remaining = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'"
      if (-not $remaining) { break }
      Start-Sleep -Milliseconds 100
    } while ((Get-Date) -lt $deadline)
    if ($remaining) { throw "lan-mouse.exe did not stop before replacement" }
  changed_when: false

- name: Install only the Windows daemon executable
  ansible.windows.win_copy:
    src: "{{ win_release_candidate }}"
    dest: "{{ win_installed_binary }}"
    remote_src: true

- name: Record installed GitHub release identity on Windows
  ansible.windows.win_copy:
    content: "{{ prepared_github_release | to_nice_json }}\n"
    dest: "{{ win_install_dir }}\\release.json"
  when: lan_mouse_install_method == 'github_release'

- name: Add Linux host to Windows hosts file
  ansible.windows.win_shell: |
    $hosts = "C:\Windows\System32\drivers\etc\hosts"
    $line = "{{ hostvars[groups['linux_desktop'][0]].ansible_host }} {{ groups['linux_desktop'][0] }}"
    $content = Get-Content $hosts -ErrorAction SilentlyContinue
    if ($content -notcontains $line) {
      Add-Content $hosts $line
      Write-Output "created"
    }
  register: win_hosts_entry
  changed_when: "'created' in win_hosts_entry.stdout"

- name: Deploy lan-mouse Windows spoke configuration
  ansible.windows.win_template:
    src: templates/spoke-config.toml.j2
    dest: "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse\\config.toml"
  vars:
    spoke_position: "{{ win_spoke_position }}"
    spoke_host: windows
  no_log: true

- name: Deploy bounded Windows log wrapper
  ansible.windows.win_template:
    src: templates/lan-mouse-windows-wrapper.ps1.j2
    dest: "{{ win_wrapper }}"
  vars:
    lan_mouse_windows_binary: "{{ win_installed_binary }}"

- name: Create scheduled task for bounded-log lan-mouse daemon
  community.windows.win_scheduled_task:
    name: LanMouseDaemon
    description: "Supervises lan-mouse at user logon and re-enables input emulation after unlock"
    actions:
      - path: "{{ win_pwsh.stdout | trim }}"
        arguments: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{{ win_wrapper }}"'
    triggers:
      - type: logon
        user_id: "{{ ansible_facts.netbios_name }}\\{{ ansible_user }}"
      - type: session_state_change
        state_change: session_unlock
        user_id: "{{ ansible_facts.netbios_name }}\\{{ ansible_user }}"
    username: "{{ ansible_user }}"
    logon_type: interactive_token
    state: present
    enabled: true
    run_level: limited
    allow_demand_start: true
    allow_hard_terminate: true
    disallow_start_if_on_batteries: false
    stop_if_going_on_batteries: false
    start_when_available: true
    execution_time_limit: PT0S
    multiple_instances: 0

- name: Detect Windows interactive desktop for the deployment user
  ansible.windows.win_shell: |
    $targetUser = "{{ ansible_user }}"
    $active = Get-CimInstance Win32_Process -Filter "Name = 'explorer.exe'" |
      ForEach-Object {
        $owner = Invoke-CimMethod -InputObject $_ -MethodName GetOwner
        if ($owner.User -ieq $targetUser) { $true }
      }
    if ($active -contains $true) { Write-Output "active" }
  register: win_interactive_desktop
  changed_when: false

- name: Record Windows interactive desktop availability
  ansible.builtin.set_fact:
    win_interactive_desktop_available: "{{ 'active' in win_interactive_desktop.stdout }}"

- name: Decide whether Windows daemon restart is required
  ansible.builtin.set_fact:
    win_runtime_changed: true

- name: Restart Windows lan-mouse when runtime inputs changed
  ansible.windows.win_shell: |
    schtasks /end /tn LanMouseDaemon 2>$null | Out-Null
    $processes = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'"
    $processes | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction Stop }

    $deadline = (Get-Date).AddSeconds(10)
    do {
      $remaining = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'"
      if (-not $remaining) { break }
      Start-Sleep -Milliseconds 100
    } while ((Get-Date) -lt $deadline)
    if ($remaining) { throw "lan-mouse.exe did not stop before scheduled task restart" }

    schtasks /run /tn LanMouseDaemon
    exit $LASTEXITCODE
  when:
    - win_runtime_changed
    - win_interactive_desktop_available
  changed_when: true

- name: Ensure Windows lan-mouse is running when inputs are unchanged
  ansible.windows.win_shell: |
    $expected = [System.IO.Path]::GetFullPath("{{ win_installed_binary }}")
    $expectedWrapper = [System.IO.Path]::GetFullPath("{{ win_wrapper }}")
    $process = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
      Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
    $parent = if ($process) {
      Get-CimInstance Win32_Process -Filter "ProcessId = $($process.ParentProcessId)"
    }
    $task = Get-ScheduledTask -TaskName LanMouseDaemon
    $supervised = $process -and
      $parent.Name -eq "pwsh.exe" -and
      $parent.CommandLine -like "*$expectedWrapper*" -and
      $task.State -eq "Running"

    if (-not $supervised) {
      schtasks /end /tn LanMouseDaemon 2>$null | Out-Null
      if ($process) {
        Stop-Process -Id $process.ProcessId -Force -ErrorAction Stop
      }

      $deadline = (Get-Date).AddSeconds(10)
      do {
        $remaining = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'" |
          Where-Object { $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected }
        if (-not $remaining) { break }
        Start-Sleep -Milliseconds 100
      } while ((Get-Date) -lt $deadline)
      if ($remaining) { throw "unsupervised lan-mouse.exe did not stop" }

      schtasks /run /tn LanMouseDaemon
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      Write-Output "started"
    }
  register: win_ensure_running
  when:
    - not win_runtime_changed
    - win_interactive_desktop_available
  changed_when: "'started' in win_ensure_running.stdout"

- name: Wait for Windows lan-mouse process
  ansible.windows.win_shell: |
    $expected = [System.IO.Path]::GetFullPath("{{ win_installed_binary }}")
    $expectedWrapper = [System.IO.Path]::GetFullPath("{{ win_wrapper }}")
    $processes = Get-CimInstance Win32_Process -Filter "Name = 'lan-mouse.exe'"
    $process = $processes |
      Where-Object {
        $_.ExecutablePath -and
        [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq $expected -and
        $_.CommandLine -match '(^|\s)daemon(\s|$)'
      } |
      Select-Object -First 1
    if (-not $process) { throw "lan-mouse.exe is not running" }
    $unexpected = $processes |
      Where-Object {
        -not $_.ExecutablePath -or
        [System.IO.Path]::GetFullPath($_.ExecutablePath) -ne $expected -or
        $_.CommandLine -notmatch '(^|\s)daemon(\s|$)'
      }
    if ($unexpected) { throw "an unexpected lan-mouse.exe process is still running" }
    $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($process.ParentProcessId)"
    if (-not $parent -or $parent.Name -ne "pwsh.exe" -or $parent.CommandLine -notlike "*$expectedWrapper*") {
      throw "lan-mouse.exe is not supervised by the scheduled wrapper"
    }
    if ((Get-ScheduledTask -TaskName LanMouseDaemon).State -ne "Running") {
      throw "LanMouseDaemon scheduled task is not running"
    }
    Write-Output $process.ExecutablePath
  register: win_process
  retries: 10
  delay: 1
  until: win_process.rc == 0
  when: win_interactive_desktop_available
  changed_when: false

- name: Require generated Windows Lan Mouse certificate
  ansible.windows.win_stat:
    path: "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse\\lan-mouse.pem"
  register: win_lan_mouse_certificate

- name: Validate generated Windows Lan Mouse certificate
  ansible.builtin.assert:
    that:
      - win_lan_mouse_certificate.stat.exists
      - win_lan_mouse_certificate.stat.size | int > 0

- name: Read Windows Lan Mouse certificate fingerprint
  ansible.windows.win_shell: |
    $pem = Get-Content -LiteralPath "{{ ansible_facts.env.LOCALAPPDATA }}\lan-mouse\lan-mouse.pem" -Raw
    $match = [regex]::Match(
      $pem,
      '-----BEGIN CERTIFICATE-----(.*?)-----END CERTIFICATE-----',
      [System.Text.RegularExpressions.RegexOptions]::Singleline
    )
    if (-not $match.Success) { throw 'Lan Mouse PEM certificate block is missing' }
    $der = [Convert]::FromBase64String(($match.Groups[1].Value -replace '\s', ''))
    $sha256 = [System.Security.Cryptography.SHA256]::Create()
    try {
      $hash = $sha256.ComputeHash($der)
      Write-Output (($hash | ForEach-Object { $_.ToString('x2') }) -join ':')
    } finally {
      $sha256.Dispose()
    }
  register: win_certificate_fingerprint
  changed_when: false

- name: Validate Windows Lan Mouse certificate fingerprint
  ansible.builtin.assert:
    that:
      - win_certificate_fingerprint.stdout | trim is regex('^([0-9a-f]{2}:){31}[0-9a-f]{2}$')

- name: Persist Windows Lan Mouse certificate fingerprint on the controller
  ansible.builtin.copy:
    content: "{{ win_certificate_fingerprint.stdout | trim }}\n"
    dest: "{{ lan_mouse_windows_fingerprint_file }}"
    mode: "0600"
  delegate_to: localhost

- name: Gather Linux hub facts for trust reconciliation
  ansible.builtin.setup:
  delegate_to: "{{ groups['linux_desktop'][0] }}"
  delegate_facts: true

- name: Reconcile Windows trust in the Linux hub configuration
  ansible.builtin.template:
    src: templates/hub-config.toml.j2
    dest: >-
      {{ hostvars[groups['linux_desktop'][0]].ansible_facts.env.HOME
         }}/.config/lan-mouse/config.toml
    mode: "0600"
  vars:
    windows_fingerprint: "{{ win_certificate_fingerprint.stdout | trim }}"
  register: reconciled_hub_config
  no_log: true
  delegate_to: "{{ groups['linux_desktop'][0] }}"

- name: Restore managed HDMI2 route in the Linux TV controller configuration
  ansible.builtin.template:
    src: templates/tv-multiview-config.toml.j2
    dest: >-
      {{ hostvars[groups['linux_desktop'][0]].ansible_facts.env.HOME
         }}/.config/tv-multiview/config.toml
    mode: "0600"
  vars:
    effective_tv_multiview_client_key_path: >-
      {{ hostvars[groups['linux_desktop'][0]].ansible_facts.env.HOME
         }}/.config/lg-buddy/.aiopylgtv.sqlite
  register: reconciled_tv_config
  no_log: true
  delegate_to: "{{ groups['linux_desktop'][0] }}"

- name: Restart changed Linux TV controller configuration
  ansible.builtin.systemd:
    name: tv-multiview.service
    scope: user
    state: restarted
  environment:
    XDG_RUNTIME_DIR: >-
      /run/user/{{ hostvars[groups['linux_desktop'][0]].ansible_facts.user_uid }}
  when: reconciled_tv_config.changed
  delegate_to: "{{ groups['linux_desktop'][0] }}"

- name: Restart changed Linux Lan Mouse trust configuration
  ansible.builtin.systemd:
    name: lan-mouse.service
    scope: user
    state: restarted
  environment:
    XDG_RUNTIME_DIR: >-
      /run/user/{{ hostvars[groups['linux_desktop'][0]].ansible_facts.user_uid }}
  when: reconciled_hub_config.changed
  delegate_to: "{{ groups['linux_desktop'][0] }}"

- name: Wait for authenticated Windows connection to the Linux hub
  ansible.windows.win_shell: |
    $clients = & "{{ win_installed_binary }}" cli list --json | ConvertFrom-Json
    if ($LASTEXITCODE -ne 0) { throw "Lan Mouse status exited with code $LASTEXITCODE" }
    $linux = $clients | Where-Object { $_.hostname -eq "{{ groups['linux_desktop'][0] }}" }
    if (-not $linux -or -not $linux.alive) {
      throw 'Windows Lan Mouse is not connected to the Linux hub'
    }
  register: win_hub_connection
  retries: 20
  delay: 1
  until: win_hub_connection.rc == 0
  when: win_interactive_desktop_available
  changed_when: false

- name: Remove obsolete per-user Windows installation after replacement
  ansible.windows.win_shell: |
    $expected = [System.IO.Path]::GetFullPath("{{ win_install_dir }}")
    $obsolete = [System.IO.Path]::GetFullPath(
      (Join-Path $env:LOCALAPPDATA "Programs\lan-mouse")
    )
    if ($obsolete -ne $expected -and (Test-Path -LiteralPath $obsolete -PathType Container)) {
      Remove-Item -LiteralPath $obsolete -Recurse -Force
      Write-Output "removed"
    }
  register: win_obsolete_install
  when: win_interactive_desktop_available
  changed_when: "'removed' in win_obsolete_install.stdout"

- name: Remove obsolete C-drive Windows build cache after replacement
  ansible.windows.win_shell: |
    $expected = [System.IO.Path]::GetFullPath("{{ win_build_cache }}")
    $obsolete = [System.IO.Path]::GetFullPath(
      (Join-Path $env:LOCALAPPDATA "lan-mouse-build")
    )
    if ($obsolete -ne $expected -and (Test-Path -LiteralPath $obsolete -PathType Container)) {
      Remove-Item -LiteralPath $obsolete -Recurse -Force
      Write-Output "removed"
    }
  register: win_obsolete_build_cache
  when: win_interactive_desktop_available
  changed_when: "'removed' in win_obsolete_build_cache.stdout"

- name: Verify persistent Windows log files exist
  ansible.windows.win_stat:
    path: "{{ ansible_facts.env.LOCALAPPDATA }}\\lan-mouse\\logs\\{{ item }}"
  loop:
    - lan-mouse.log
    - lan-mouse.err.log
  register: win_logs
  when: win_interactive_desktop_available

- name: Require persistent Windows log sources
  ansible.builtin.assert:
    that: win_logs.results | selectattr('stat.exists', 'equalto', true) | list | length == 2
  when: win_interactive_desktop_available

- name: Open Windows Firewall for lan-mouse (UDP {{ lan_mouse_port }})
  ansible.windows.win_shell: |
    $existing = Get-NetFirewallRule -Name lan-mouse -ErrorAction SilentlyContinue
    if (-not $existing) {
      New-NetFirewallRule -Name lan-mouse -DisplayName lan-mouse -Enabled True -Profile Any -Direction Inbound -Protocol UDP -Action Allow -LocalPort {{ lan_mouse_port }} | Out-Null
      Write-Output "created"
    }
  register: win_firewall
  changed_when: "'created' in win_firewall.stdout"

- name: Open Windows Firewall for authenticated clipboard (TCP {{ lan_mouse_port }})
  ansible.windows.win_shell: |
    $existing = Get-NetFirewallRule -Name lan-mouse-clipboard -ErrorAction SilentlyContinue
    if (-not $existing) {
      New-NetFirewallRule -Name lan-mouse-clipboard -DisplayName "lan-mouse authenticated clipboard" -Enabled True -Profile Any -Direction Inbound -Protocol TCP -Action Allow -LocalPort {{ lan_mouse_port }} | Out-Null
      Write-Output "created"
    }
  register: win_clipboard_firewall
  changed_when: "'created' in win_clipboard_firewall.stdout"
