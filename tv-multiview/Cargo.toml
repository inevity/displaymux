[package]
name = "tv-multiview"
version = "0.1.0"
edition = "2021"
description = "MultiView-aware HDMI input switch daemon for lan-mouse + LG WebOS TV"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
